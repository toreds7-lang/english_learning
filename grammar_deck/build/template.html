<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data: blob:; font-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 구문 지도 101</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --soft:#f0ece3; --ink:#1c2128; --muted:#5f6772; --line:#e2ddd2;
  --accent:#0f766e; --accent-ink:#ffffff; --good:#15803d; --warn:#c2410c; --bad:#b91c1c; --rev:#d97706;
  --S:#2563eb; --V:#dc2626; --O:#15803d; --C:#ea580c; --M:#64748b; --A:#7c3aed; --X:#334155; --G:#94a3b8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --panel:#1b1f26; --soft:#232832; --ink:#e8eaee; --muted:#9aa3ae; --line:#2e3440;
    --accent:#2dd4bf; --accent-ink:#06201d; --good:#4ade80; --warn:#fb923c; --bad:#f87171; --rev:#fbbf24;
    --S:#60a5fa; --V:#f87171; --O:#4ade80; --C:#fb923c; --M:#94a3b8; --A:#a78bfa; --X:#cbd5e1; --G:#64748b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161b; --panel:#1b1f26; --soft:#232832; --ink:#e8eaee; --muted:#9aa3ae; --line:#2e3440;
  --accent:#2dd4bf; --accent-ink:#06201d; --good:#4ade80; --warn:#fb923c; --bad:#f87171; --rev:#fbbf24;
  --S:#60a5fa; --V:#f87171; --O:#4ade80; --C:#fb923c; --M:#94a3b8; --A:#a78bfa; --X:#cbd5e1; --G:#64748b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Segoe UI","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;}
button{font:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;left:0;right:0;top:0;bottom:46px;overflow:hidden}
#canvas{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--bg);transform-origin:center center;transform:translate(-50%,-50%)}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--accent);transition:width .25s;z-index:5}
#nav{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--panel);border-top:1px solid var(--line);font-size:14px;z-index:6}
#nav .nb{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 10px;line-height:1.2;white-space:nowrap}
#nav .nb:hover{border-color:var(--accent)}
#nav .nb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#nav .cnt{min-width:76px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
#nav .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);padding:0 8px}
#nav input{width:84px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit}

/* ---------- slide frame ---------- */
.slide{position:absolute;inset:0;padding:20px 34px 14px;display:flex;flex-direction:column;overflow:hidden}
.crumb{font-size:13px;color:var(--muted);letter-spacing:.01em}
.crumb b{color:var(--ink);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;font-size:14px;line-height:1.2;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12.5px;box-shadow:none}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* ---------- unit slide ---------- */
.u-head{display:grid;grid-template-columns:1fr auto;gap:2px 18px;align-items:end;padding-bottom:9px;border-bottom:2px solid var(--line)}
.u-title{display:flex;align-items:baseline;gap:12px;min-width:0}
.u-no{font-weight:800;font-size:14px;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 11px;white-space:nowrap;align-self:center}
.u-no.fs{background:var(--rev);color:#1c1300}
.u-title h2{margin:0;font-size:29px;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
.u-title h2.long{font-size:24px}.u-title h2.xlong{font-size:21px}
.u-head>div:first-child{min-width:0}
.u-sub{font-size:17px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chl{display:flex;gap:4px;align-items:center}
.chl .st{width:28px;height:28px;border-radius:50%;border:2px solid var(--pc,var(--accent));background:var(--panel);font-size:11px;font-weight:700;padding:0;display:grid;place-items:center}
.chl .st.fs{border-radius:7px;width:24px;height:24px;font-size:10px}
.chl .st.cur{background:var(--pc,var(--accent));color:#fff;transform:scale(1.15)}
.chl .st.got{box-shadow:inset 0 0 0 3px var(--good)}
.chl .st.rev{box-shadow:inset 0 0 0 3px var(--rev)}
.chl .ln{width:8px;height:3px;background:var(--pc,var(--accent));opacity:.6}
.thr{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.thr .tb{font-size:11.5px;border-radius:999px;padding:2px 9px;border:1.5px solid var(--tc);color:var(--ink);background:color-mix(in srgb,var(--tc) 10%,var(--panel))}
.u-body{flex:1;min-height:0;display:grid;grid-template-columns:505px 1fr;gap:22px;padding-top:12px}
.fit{min-height:0;overflow:hidden;font-size:17px}
.col-l{display:flex;flex-direction:column;gap:.6em}
.formula{font-size:1.02em;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.45em .7em;line-height:1.9}
.formula .b>.bt{padding:.02em .3em}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.32em}
.pts li{position:relative;padding-left:1.05em;font-size:1em;line-height:1.45}
.pts li::before{content:"";position:absolute;left:.15em;top:.62em;width:.42em;height:.42em;border-radius:50%;background:var(--accent)}
.pts b{color:var(--ink)}
.tip{font-size:.92em;line-height:1.45;background:color-mix(in srgb,var(--rev) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--rev) 40%,var(--line));border-radius:10px;padding:.45em .75em}
.tip::before{content:"수능 포인트 ";font-weight:800;color:var(--warn)}
.col-r{display:flex;flex-direction:column;gap:.55em}
.ex-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.95em;color:var(--muted)}
.ex-h .sp{flex:1}
.exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em}
.ex{display:grid;grid-template-columns:1.6em 1fr auto;gap:.2em .6em;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5em .6em .45em;position:relative}
.ex.sh-on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.exn{font-weight:800;color:var(--muted);font-size:.95em;padding-top:.35em;text-align:center}
.ex .sent{font-size:1.24em}
.exc{display:flex;gap:4px;padding-top:.15em}
.exc button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:2px 6px;font-size:.82em;line-height:1.3}
.exc button:hover{border-color:var(--accent)}
.exc button.on{background:var(--accent);color:var(--accent-ink)}
.ko{display:none;grid-column:2/4;font-size:.9em;color:var(--muted);padding:.05em 0 .05em .1em}
.ko .hl{color:var(--ink)}
.ex.kon .ko,body.allko .ko{display:block}
.shbar{grid-column:1/4;height:5px;border-radius:3px;background:var(--soft);overflow:hidden;display:none}
.shbar i{display:block;height:100%;width:0;background:var(--accent)}
.ex.sh-wait .shbar{display:block}
.shmsg{position:absolute;right:.6em;bottom:.2em;font-size:.75em;font-weight:800;color:var(--accent)}
.u-foot{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line);min-height:46px}
.links{flex:1;display:flex;gap:4px 6px;flex-wrap:wrap;overflow:hidden;align-items:center;min-width:0;max-height:64px}
.links .lk-h{font-size:12px;color:var(--muted);white-space:nowrap}
.lchip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}
.lchip:hover{border-color:var(--accent)}
.lchip i{font-style:normal;color:var(--muted)}
.pg{display:flex;gap:6px}
.pg .btn.got.on{background:var(--good);border-color:var(--good);color:#fff}
.pg .btn.rev.on{background:var(--rev);border-color:var(--rev);color:#1c1300}

/* ---------- blocks ---------- */
.sent{position:relative;line-height:1.3;overflow-wrap:break-word}
.sent.lk{padding-top:.95em}
.sent.lk .b{margin-top:.55em}
.b{display:inline-flex;flex-direction:column;align-items:stretch;margin:0 .07em;--rc:var(--X);max-width:100%}
.f-S{--rc:var(--S)} .f-V{--rc:var(--V)} .f-O{--rc:var(--O)} .f-C{--rc:var(--C)} .f-M{--rc:var(--M)} .f-A{--rc:var(--A)} .f-X{--rc:var(--X)} .f-G{--rc:var(--G)}
.b>.bt{padding:.06em .3em .08em;border-radius:.3em;background:color-mix(in srgb,var(--rc) 13%,var(--panel));border-bottom:.15em solid var(--rc)}
.b>.bl{font-size:.5em;font-weight:800;color:var(--rc);text-align:center;letter-spacing:.03em;line-height:1.25;padding-top:.12em;white-space:nowrap}
.b.in>.bt{background:transparent;border:1px dashed color-mix(in srgb,var(--rc) 65%,transparent);border-bottom:.12em solid var(--rc);padding:0 .2em}
.b.in>.bl{font-size:.46em}
.b.x>.bt{background:transparent;border-bottom-color:transparent;padding-left:.08em;padding-right:.08em}
.b.gap>.bt{background:transparent;border:1px dashed var(--G);color:var(--muted);font-style:italic}
.b.gap>.bl{color:var(--muted)}
.hl{font-weight:800;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--rc,var(--accent)) 65%,transparent);text-decoration-thickness:.11em;text-underline-offset:.16em}
.anc{border-radius:.2em;box-shadow:inset 0 -.12em 0 color-mix(in srgb,var(--accent) 45%,transparent)}
.nolab .b>.bl{display:none}
.nb{white-space:nowrap}.nb>.b{white-space:normal}
svg.lk{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.lk path{fill:none;stroke:var(--rc);stroke-width:1.6}
svg.lk path.ah{fill:var(--rc);stroke:none}
svg.lk circle.eqc{fill:var(--panel);stroke:var(--rc);stroke-width:1.2}
svg.lk text{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--rc);stroke:none}

/* ---------- viz ---------- */
.viz{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.6em .75em;font-size:.95em}
.viz+.viz{margin-top:.1em}
.vnote{font-size:.85em;color:var(--muted);margin-top:.4em;line-height:1.4}
.vh{font-size:.8em;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:.35em}
.viz .sent{font-size:1.12em}
/* morph */
.mstage{min-height:3.6em;padding:.2em .1em;font-size:1.12em;position:relative}
.mstage .w{display:inline-block}
.mstage .enter{animation:pop .7s ease}
@keyframes pop{0%{filter:brightness(1.6);box-shadow:0 0 0 .2em color-mix(in srgb,var(--accent) 50%,transparent)}100%{filter:none;box-shadow:0 0 0 0 transparent}}
.ghost{position:absolute;pointer-events:none;animation:gone .6s ease forwards;margin:0}
@keyframes gone{to{opacity:0;transform:translateY(-.6em) scale(.9)}}
.msteps{list-style:none;margin:.35em 0 0;padding:0;display:flex;flex-direction:column;gap:.18em}
.msteps li{font-size:.84em;padding:.18em .5em;border-radius:7px;color:var(--muted);cursor:pointer;line-height:1.35}
.msteps li b{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:50%;background:var(--soft);margin-right:.35em;font-size:.85em;color:var(--ink)}
.msteps li.on{background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--ink);font-weight:700}
.msteps li.on b{background:var(--accent);color:var(--accent-ink)}
.mctl{display:flex;gap:6px;margin-top:.4em}
/* compare */
.cmp{display:grid;gap:.5em}
.cmp .cc{border:1px solid var(--line);border-radius:10px;padding:.45em .55em;background:var(--bg);position:relative}
.cmp .cc h4{margin:0 0 .3em;font-size:.82em;color:var(--muted);font-weight:800}
.cmp .cc .sent{font-size:1em}
.cmp .cc.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.cmp .cc.no{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.cmp .cc.no{background:color-mix(in srgb,var(--bad) 6%,var(--bg))}
.cmp .cc.no .sent{opacity:.8}
.cmp .cc .mk{position:absolute;right:.45em;top:.3em;font-weight:900}
.cmp .cc.ok .mk{color:var(--good)} .cmp .cc.no .mk{color:var(--bad)}
.cmp .cc .cn{font-size:.8em;color:var(--muted);margin-top:.3em;line-height:1.35}
/* table */
table.vt{border-collapse:collapse;width:100%;font-size:.86em}
table.vt th,table.vt td{border-bottom:1px solid var(--line);padding:.28em .4em;text-align:left;vertical-align:top;line-height:1.35}
table.vt th{font-size:.9em;color:var(--muted);font-weight:800;background:var(--soft)}
table.vt td.c,table.vt th.c{text-align:center}
table.vt td .sent{font-size:1em}
table.vt s{color:var(--bad)}
.yes{color:var(--good);font-weight:900}.no{color:var(--bad);font-weight:900}
/* rows */
.rws{display:flex;flex-direction:column;gap:.4em}
.rw{display:grid;grid-template-columns:auto 1fr auto;gap:.2em .6em;align-items:center;border-left:3px solid var(--accent);padding:.15em .3em .15em .5em;border-radius:0 8px 8px 0}
.rw .rf{font-size:.8em;font-weight:800;background:var(--soft);border-radius:7px;padding:.18em .45em;white-space:nowrap}
.rw .sent{font-size:1em}
.rw .rn{font-size:.78em;color:var(--muted);text-align:right;white-space:nowrap}
.rw .ru{font-size:.75em;font-weight:800;color:var(--accent);white-space:nowrap}
.rw.lnk{cursor:pointer}
.rw.lnk:hover{background:var(--soft)}
/* slots */
.slots{display:flex;gap:.5em;align-items:flex-start}
.slot.dim{flex:.45}
.slot{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25em;align-items:stretch}
.slot .sh{--rc:var(--X);border-radius:10px;border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 13%,var(--panel));text-align:center;padding:.3em .2em;font-weight:900;font-size:1.05em;color:var(--rc)}
.slot .sh small{display:block;font-size:.62em;color:var(--muted);font-weight:700}
.slot.dim .sh{opacity:.45}
.fills{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr));gap:.25em}
.fill{font-size:.78em;border:1px solid var(--line);border-radius:8px;padding:.2em .35em;background:var(--bg);text-align:center;line-height:1.3}
.fill.lnk{cursor:pointer;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.fill.lnk:hover{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.fill.lnk small{display:block;color:var(--accent);font-weight:800;font-size:.85em}
.fill.no{text-decoration:line-through;color:var(--bad);border-style:dashed}
/* flow */
.flow{display:flex;flex-direction:column;align-items:center;gap:.35em;font-size:.88em}
.fq{border:2px solid var(--accent);border-radius:10px;padding:.35em .6em;font-weight:700;text-align:center;background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.fbr{display:grid;grid-template-columns:1fr 1fr;gap:.6em;width:100%}
.fb{display:flex;flex-direction:column;align-items:center;gap:.3em}
.fl{font-size:.8em;font-weight:800;color:var(--muted)}
.fl::before{content:"↓ "}
.fa{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.35em .55em;text-align:center;width:100%}
.fa b{color:var(--accent)}
.fa .sent{font-size:.95em;margin-top:.2em}
/* meter */
.mtr{display:flex;flex-direction:column;gap:.32em}
.mrow{display:grid;grid-template-columns:8.6em 1fr;gap:.5em;align-items:center}
.mrow .mw{font-weight:800;font-size:.9em;text-align:right;white-space:nowrap}
.mtrack{height:1.35em;background:var(--soft);border-radius:999px;position:relative;overflow:hidden}
.mtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 35%,var(--panel)),var(--accent))}
.mtrack span{position:absolute;left:.6em;top:0;bottom:0;display:flex;align-items:center;font-size:.76em;font-weight:700;color:var(--ink)}
.mlh{display:flex;justify-content:space-between;font-size:.74em;color:var(--muted);padding-left:9.1em}
/* pair */
.pr{display:grid;grid-template-columns:auto auto auto 1fr;gap:.3em .6em;align-items:center;font-size:.88em}
.pr .pe{font-weight:800;white-space:nowrap}
.pr .pd{display:flex;gap:.25em}
.pr .pd span{width:1.55em;height:1.55em;border-radius:50%;display:grid;place-items:center;font-size:.78em;font-weight:900;border:2px solid var(--S);color:var(--S)}
.pr .pd span.on{background:var(--S);color:#fff}
.pr .pd span.half{background:linear-gradient(90deg,var(--S) 50%,transparent 50%);color:var(--ink)}
.pr .pd span.off{opacity:.35;border-style:dashed}
.pr .pv{font-size:.8em;font-weight:800;color:var(--V);white-space:nowrap}
.pr .pk{font-size:.8em;color:var(--muted)}
/* bars */
.bars{display:flex;gap:.8em;justify-content:space-around;align-items:flex-end}
.bg{display:flex;flex-direction:column;align-items:center;gap:.25em;min-width:0}
.bg .bb{display:flex;gap:.3em;align-items:flex-end;height:6.2em}
.bg .bar{width:2.2em;border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--S) 45%,var(--panel));position:relative}
.bg .bar.hl{background:var(--S)}
.bg .bar small{position:absolute;bottom:-1.3em;left:50%;transform:translateX(-50%);font-size:.7em;white-space:nowrap;color:var(--muted)}
.bg .cap{margin-top:1.3em;font-size:.8em;font-weight:800;text-align:center}
/* groups (dots) */
.grs{display:flex;flex-direction:column;gap:.45em}
.gr{display:grid;grid-template-columns:7.6em 1fr;gap:.6em;align-items:center}
.gr .gl{font-size:.82em;font-weight:800;line-height:1.3}
.gr .gg{display:flex;gap:.6em;flex-wrap:wrap}
.gset{display:flex;flex-direction:column;align-items:center;gap:.15em}
.gset .dts{display:flex;gap:.18em;padding:.18em .3em;border-radius:999px;border:1.5px solid var(--line)}
.gset .dts i{width:.95em;height:.95em;border-radius:50%;background:var(--S);display:block}
.gset .dts i.off{background:transparent;border:1.5px solid var(--M)}
.gset small{font-size:.74em;font-weight:800}
/* emotion */
.emo{display:grid;grid-template-columns:1fr auto 1fr;gap:.3em .4em;align-items:center;text-align:center}
.emo .eb{border:2px solid var(--line);border-radius:12px;padding:.4em;font-weight:800;background:var(--bg)}
.emo .ea{font-size:.8em;color:var(--muted);font-weight:700}
.emo .ea::after{content:"";display:block;height:3px;background:var(--accent);margin-top:.2em;border-radius:2px;
  clip-path:polygon(0 0,92% 0,92% -150%,100% 50%,92% 250%,92% 100%,0 100%)}
.emo .ew{font-size:.9em;font-weight:800;line-height:1.3}
.emo .ew small{display:block;color:var(--muted);font-weight:600;font-size:.82em}
.emo .ing{color:var(--C)} .emo .pp{color:var(--S)}
/* prep */
.preps{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:.4em}
.prep{border:1px solid var(--line);border-radius:10px;padding:.35em;text-align:center;background:var(--bg)}
.prep.lnk{cursor:pointer}.prep.lnk:hover{border-color:var(--accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5em,1fr));gap:.45em}

.scl .pan{transform:translateY(-.2em);border:2px solid var(--O);border-radius:9px;padding:.15em .45em;font-weight:800;font-size:.86em;background:var(--panel);white-space:nowrap}
.scl .mid{position:absolute;left:50%;bottom:.6em;transform:translateX(-50%);font-weight:900;color:var(--accent)}
.scl .ful{width:0;height:0;border-left:.8em solid transparent;border-right:.8em solid transparent;border-bottom:1.1em solid var(--muted)}
.scl .cap{font-size:.8em;margin-top:.2em;font-weight:700}
.scl.bad .pan{border-color:var(--bad)}
.scl.bad .cap{color:var(--bad)} .scl.ok .cap{color:var(--good)}
.sclw+.sclw{margin-top:.3em}
/* trend */
svg.tr text{font-size:12px;fill:var(--muted);font-weight:700}
svg.tr .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
svg.tr .ln{stroke:var(--accent);stroke-width:3;fill:none}
/* timeline */
svg.tl{width:100%;max-width:540px;height:auto;display:block;margin:0 auto}
svg.tl text{font-size:11.5px;fill:var(--ink)}
svg.tl .rl{font-weight:800;font-size:12px}

.p-wrap{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:stretch;padding-top:12px;min-height:0}
.p-hero{display:flex;flex-direction:column;gap:6px;padding:14px 0 10px;border-bottom:2px solid var(--line)}
.p-hero .pn{font-size:16px;font-weight:900;letter-spacing:.12em;color:var(--pc)}
.p-hero h1{margin:0;font-size:46px;letter-spacing:-.02em}
.p-hero .en{font-size:18px;color:var(--muted)}
.chcards{display:flex;flex-direction:column;gap:8px}
.chcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.chcard:hover{border-color:var(--pc)}
.chcard .n{font-weight:900;color:var(--pc);font-size:15px}
.chcard .t{font-weight:800;font-size:17px}
.chcard .u{font-size:12.5px;color:var(--muted)}

.mleg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);align-items:center;justify-content:flex-end}

.thrw .tu .ar{color:var(--tc);font-weight:900;font-size:12px}

.meterbar{flex:1;height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}

/* ---------- drawer / modal ---------- */
#drawer{position:fixed;top:0;bottom:46px;left:0;width:380px;max-width:92vw;background:var(--panel);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .22s;z-index:8;display:flex;flex-direction:column;box-shadow:var(--shadow)}

#drawer .dh{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}

#drawer .dp{font-weight:900;color:var(--pc);padding:10px 8px 2px;font-size:13px;letter-spacing:.04em}
#drawer .dc{font-weight:800;padding:6px 8px 2px;font-size:13.5px;cursor:pointer}

#drawer .di .s.rev{background:var(--rev);border-color:var(--rev)}

#modal.open{display:grid}
#modal .mb{width:min(860px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.35);padding:18px 22px;position:relative}
#modal .mx{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;color:var(--muted)}
#modal h3{margin:0 0 10px;font-size:20px}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--bg)}
.q .qq{font-size:17px;font-weight:700;line-height:1.45}
.q .sent{font-size:21px;margin:8px 0 2px}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.q .opt{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:16px}
.q .opt:hover:not([disabled]){border-color:var(--accent)}
.q .opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.q .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.q .why{display:none;margin-top:10px;font-size:15px;line-height:1.5;border-left:4px solid var(--accent);padding:4px 10px}
.q.done .why{display:block}
.dr-k{font-size:17px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.dr-k small{color:var(--muted);font-weight:700;margin-right:6px}
.dr-ans{min-height:88px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:10px}
.dr-ans.ok{border-color:var(--good);border-style:solid;background:color-mix(in srgb,var(--good) 8%,var(--panel))}
.dr-pool{display:flex;flex-wrap:wrap;gap:6px;min-height:60px;margin-bottom:10px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 7px;font-size:20px;line-height:1.25}
.tile:hover{border-color:var(--accent)}
.tile.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tile .b{margin:0}

.toast.on{opacity:.95}
@media (max-width:720px){#nav .ttl{display:none}#nav input{width:60px}}
@media print{#nav,#bar,#drawer{display:none}}

<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('gm-data').textContent);
let AU = {};
try { AU = JSON.parse(document.getElementById('gm-audio').textContent) || {}; } catch (e) { AU = {}; }
const $ = (s, r) => (r || document).querySelector(s);

};
let PROG = store.get('prog', {}) || {};
const saveProg = () => store.set('prog', PROG);

/* ---------- index ---------- */
const PARTS = {}, CHS = {}, ITEMS = {}, ORDER = [], THR_OF = {};
D.parts.forEach(p => { PARTS[p.id] = p; p.chapters = []; });
D.chapters.forEach(c => {
  CHS[c.id] = c; PARTS[c.part].chapters.push(c);
  c.items.forEach(it => { it.ch = c.id; it.part = c.part; ITEMS[it.id] = it; ORDER.push(it); });

const THREADS = {}; D.threads.forEach(t => THREADS[t.id] = t);
const itemCode = it => it.kind === 'fs' ? 'FS' + it.fsno : 'Unit ' + String(it.no).padStart(2, '0');
const itemShort = it => it.kind === 'fs' ? 'FS' + it.fsno : String(it.no).padStart(2, '0');
const itemName = it => (it.kind === 'fs' ? 'FS' + it.fsno + ' ' : 'U' + String(it.no).padStart(2, '0') + ' ') + it.title;

/* ---------- slides ---------- */
const SL = [];
SL.push({type:'title', id:'title', name:'표지'});
SL.push({type:'howto', id:'howto', name:'보는 법'});
SL.push({type:'map', id:'map', name:'구문 지도'});
SL.push({type:'threads', id:'threads', name:'연결고리 9가지'});
D.parts.forEach(p => {
  SL.push({type:'part', id:p.id, ref:p, name:'PART ' + p.no + ' ' + p.title});
  p.chapters.forEach(c => {
    SL.push({type:'chapter', id:c.id, ref:c, name:'CHAPTER ' + String(c.no).padStart(2,'0') + ' ' + c.title});
    c.items.forEach(it => SL.push({type:'item', id:it.id, ref:it, name:itemName(it)}));
  });
});
SL.push({type:'board', id:'board', name:'진도판'});
const IDX = {}; SL.forEach((s, i) => IDX[s.id] = i);

/* ---------- markup parser ---------- */
const ROLE = {S:'S',V:'V',O:'O',IO:'I.O.',DO:'D.O.',C:'C',OC:'O.C.',M:'M',A:'A',X:'',G:'생략'};
const ROLE_KO = {S:'주어',V:'동사',O:'목적어',IO:'간접목적어',DO:'직접목적어',C:'보어',OC:'목적격보어',M:'수식어',A:'필수 부사어',X:'',G:'생략된 말'};
const FAM = {S:'S',V:'V',O:'O',IO:'O',DO:'O',C:'C',OC:'C',M:'M',A:'A',X:'X',G:'G'};
const MKC = new Map();
function parseMk(src) {
  const s = String(src);
  if (MKC.has(s)) return MKC.get(s);
  let i = 0;
  function seq(end) {
    const out = []; let buf = '';
    const flush = () => { if (buf) { out.push({t:'txt', v:buf}); buf = ''; } };
    while (i < s.length) {
      const ch = s[i];
      if (end && ch === end) { flush(); i++; return out; }
      if (ch === '[') { flush(); i++; out.push(blk()); continue; }

function morphShow(stage, i, animate) {

  $$('svg.lk', stage).forEach(x => x.remove());
  const base = stage.getBoundingClientRect();
  const old = new Map();
  $$('[data-k]', stage).forEach(el => old.set(el.dataset.k, {r:el.getBoundingClientRect(), el}));
  const newKeys = new Set();
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  $$('[data-k]', tmp).forEach(el => newKeys.add(el.dataset.k));

    if (newKeys.has(k)) return;
    const par = o.el.parentElement && o.el.parentElement.closest('[data-k]');
    if (par && !newKeys.has(par.dataset.k) && stage.contains(par)) return;

    g.style.left = ((o.r.left - base.left) / SCALE) + 'px'; g.style.top = ((o.r.top - base.top) / SCALE) + 'px';
    ghosts.push(g);

  stage.innerHTML = html;
  stage.classList.toggle('lk', hasLinks(v.steps[i][0]));
  ghosts.forEach(g => { stage.appendChild(g); setTimeout(() => g.remove(), 650); });
  const applied = new Map();
  $$('[data-k]', stage).forEach(el => {
    if (el.classList.contains('ghost')) return;
    const o = old.get(el.dataset.k);
    if (!o) { el.classList.add('enter'); return; }

    let dx = (o.r.left - r.left) / SCALE, dy = (o.r.top - r.top) / SCALE;
    const anc = el.parentElement && el.parentElement.closest('[data-k]');
    if (anc && applied.has(anc)) { const p = applied.get(anc); dx -= p[0]; dy -= p[1]; }

    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;

/* ---------- fit ---------- */
function fit(root) {
  $$('.fit', root).forEach(el => {
    if (!el.dataset.fs) el.dataset.fs = parseFloat(el.style.fontSize || getComputedStyle(el).fontSize);
    let fs = +el.dataset.fs;
    el.style.fontSize = fs + 'px';
    const min = parseFloat(el.dataset.min || 11);
    let guard = 0;
    while (el.scrollHeight > el.clientHeight + 1 && fs > min && guard++ < 40) { fs -= 0.5; el.style.fontSize = fs + 'px'; }
    el.classList.toggle('overflow', el.scrollHeight > el.clientHeight + 1);
  });
}
function relayout() { fit(canvas); drawLinks(canvas); }

/* drill pieces: top-level blocks, opened up until there are at least 5 pieces */
function drillTiles(nodes) {
  const P = /^[,.;:?!—–-]+$/;
  const units = [];
  const addWords = (txt, role, lab, list) => txt.replace(/\*/g, '').split(/\s+/).filter(Boolean).forEach(tk => {
    if (P.test(tk) && list.length) list[list.length - 1].tail = (list[list.length - 1].tail || '') + tk;
    else list.push({kind:'frag', role, lab, text:tk});
  });
  nodes.forEach(n => {
    if (n.t === 'txt') addWords(n.v, 'X', '', units);
    else if (!(n.t === 'blk' && n.role.toUpperCase() === 'G')) units.push({kind:'node', node:n});
  });
  const nw = u => (u.kind === 'frag' ? u.text : tidy(plain([u.node]))).split(/\s+/).filter(Boolean).length;
  for (let guard = 0; units.length < 5 && guard < 12; guard++) {
    let best = -1, bw = 1;
    units.forEach((u, i) => { const w = nw(u); if (w > bw) { bw = w; best = i; } });
    if (best < 0) break;
    const u = units[best];
    let parts = [];
    if (u.kind === 'node') {
      const n = u.node, U = n.t === 'blk' ? n.role.toUpperCase() : 'X';
      const lab = n.t === 'blk' ? (n.lab != null ? n.lab : (n.role !== U ? (ROLE[U] || '').toLowerCase() : ROLE[U])) : '';
      if (n.kids.some(k => k.t !== 'txt')) {
        n.kids.forEach(k => {
          if (k.t === 'txt') { const t = k.v.replace(/\*/g, '').trim(); if (t && !P.test(t)) parts.push({kind:'frag', role:U, lab, text:t}); else if (t && parts.length) parts[parts.length - 1].tail = (parts[parts.length - 1].tail || '') + t; }
          else if (!(k.t === 'blk' && k.role.toUpperCase() === 'G')) parts.push({kind:'node', node:k});
        });
      } else {
        const ws = tidy(plain(n.kids)).split(/\s+/), mid = Math.max(1, Math.floor(ws.length / 2));
        parts = [{kind:'frag', role:U, lab, text:ws.slice(0, mid).join(' ')}, {kind:'frag', role:U, lab, text:ws.slice(mid).join(' ')}];
      }
    } else {
      const ws = u.text.split(/\s+/), mid = Math.max(1, Math.floor(ws.length / 2));
      parts = [{kind:'frag', role:u.role, lab:u.lab, text:ws.slice(0, mid).join(' ')}, {kind:'frag', role:u.role, lab:u.lab, text:ws.slice(mid).join(' ')}];
    }
    if (!parts.length) break;
    parts[parts.length - 1].tail = (parts[parts.length - 1].tail || '') + (u.tail || '');
    units.splice(best, 1, ...parts);
  }
  return units;
}
let DR = null;
function openBuild() {

    const fam = FAM[u.role] || 'X';

  });
  tiles.forEach((t, i) => { t.i = i; t.key = (t.txt + t.tail).toLowerCase(); });
  let pool = tiles.slice();

  else if (/^FS\d+$/.test(v)) id = 'FS' + String(+v.slice(2)).padStart(2, '0');
  else if (/^(CH|C)\d+$/.test(v)) id = 'C' + String(+v.replace(/\D/g, '')).padStart(2, '0');
  else if (/^P\d$/.test(v)) id = v;
  if (id && IDX[id] != null) { show(IDX[id]); ev.target.value = ''; ev.target.blur(); } else toast('찾을 수 없어요: ' + ev.target.value);
});
document.addEventListener('keydown', ev => {
  if (ev.target && ev.target.closest && ev.target.closest('input,textarea')) { if (ev.key === 'Escape') ev.target.blur(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key;
  if (k === 'Escape') { if ($('#modal').classList.contains('open')) closeModal(); else if ($('#drawer').classList.contains('open')) toggleDrawer(false); else stopShadow(); return; }
  if ($('#modal').classList.contains('open')) return;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { ev.preventDefault(); show(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); show(cur - 1); }
  else if (k === 'Home') show(0); else if (k === 'End') show(SL.length - 1);
  else if (k === 'm' || k === 'M') { ACTIVE_TH = null; show(IDX.map); }
  else if (k === 't' || k === 'T') toggleDrawer();
  else if (k === 'k' || k === 'K') $('[data-nav="ko"]').click();
  else if (k === 'q' || k === 'Q') openCheck();
  else if (k === 'b' || k === 'B') openBuild();
  else if (k === 'g' || k === 'G') mark('got');
  else if (k === 'r' || k === 'R') mark('rev');
  else if (k === 's' || k === 'S') { const b = $('[data-act="shadow"]', canvas); if (b) shadow(b); }
  else if (k === 'n' || k === 'N') { const b = $('[data-act="mnext"]', canvas); if (b) b.click(); }
  else if (/^[1-3!@#]$/.test(k)) {
    const idx = '123'.indexOf(k) >= 0 ? '123'.indexOf(k) : '!@#'.indexOf(k);
    const ex = $$('.ex', canvas)[idx]; if (ex) { const slow = ev.shiftKey || '!@#'.indexOf(k) >= 0; playKey(slow ? ex.dataset.a1 : ex.dataset.a0, ex.dataset.txt, slow); }
  }
});
let tx0 = null;
canvas.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; }, {passive:true});
canvas.addEventListener('touchend', e => { if (tx0 == null) return; const dx = e.changedTouches[0].clientX - tx0; if (Math.abs(dx) > 70) show(cur + (dx < 0 ? 1 : -1)); tx0 = null; }, {passive:true});
window.addEventListener('resize', rescale);
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (IDX[id] != null && IDX[id] !== cur) show(IDX[id], true); });

/* ---------- boot ---------- */
const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th;
rescale();
const h0 = location.hash.slice(1);
show(IDX[h0] != null ? IDX[h0] : (IDX[store.get('last', '')] != null ? IDX[store.get('last', '')] : 0));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
window.GM = {SL, IDX, show, D, fit, ITEMS, get cur() { return cur; }, AU};
})();
