<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장이 자란다</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --soft:#f0ece3; --ink:#1c2128; --muted:#5f6772; --line:#e2ddd2;
  --accent:#0f766e; --accent-ink:#ffffff; --good:#15803d; --bad:#b91c1c; --warn:#c2410c; --rev:#d97706;
  --S:#2563eb; --V:#dc2626; --H:#7c3aed; --N:#db2777; --O:#15803d; --C:#ea580c; --M:#64748b; --Q:#0891b2; --K:#b45309; --G:#94a3b8; --X:#334155;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --panel:#1b1f26; --soft:#232832; --ink:#e8eaee; --muted:#9aa3ae; --line:#2e3440;
    --accent:#2dd4bf; --accent-ink:#06201d; --good:#4ade80; --bad:#f87171; --warn:#fb923c; --rev:#fbbf24;
    --S:#60a5fa; --V:#f87171; --H:#a78bfa; --N:#f472b6; --O:#4ade80; --C:#fb923c; --M:#94a3b8; --Q:#22d3ee; --K:#fbbf24; --G:#64748b; --X:#cbd5e1;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161b; --panel:#1b1f26; --soft:#232832; --ink:#e8eaee; --muted:#9aa3ae; --line:#2e3440;
  --accent:#2dd4bf; --accent-ink:#06201d; --good:#4ade80; --bad:#f87171; --warn:#fb923c; --rev:#fbbf24;
  --S:#60a5fa; --V:#f87171; --H:#a78bfa; --N:#f472b6; --O:#4ade80; --C:#fb923c; --M:#94a3b8; --Q:#22d3ee; --K:#fbbf24; --G:#64748b; --X:#cbd5e1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Segoe UI","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:700 .78em/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--soft);color:var(--muted)}
a{color:var(--accent)}
#stage{position:fixed;left:0;right:0;top:0;bottom:46px;overflow:hidden}
#canvas{width:1280px;height:720px;position:absolute;left:50%;top:50%;background:var(--bg);transform-origin:center center;transform:translate(-50%,-50%)}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--accent);transition:width .25s;z-index:5}
#nav{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--panel);border-top:1px solid var(--line);font-size:14px;z-index:6}
#nav .nb{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 10px;line-height:1.2;white-space:nowrap}
#nav .nb:hover{border-color:var(--accent)}
#nav .nb.off{opacity:.5;text-decoration:line-through}
#nav .cnt{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
#nav .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);padding:0 8px}
#nav input{width:78px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit}

/* ---------- frame ---------- */
.slide{position:absolute;inset:0;padding:16px 32px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;font-size:14px;line-height:1.2;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px;box-shadow:none}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.no{color:var(--bad);font-weight:900}.yes{color:var(--good);font-weight:900}
.g-head{border-bottom:2px solid var(--line);padding-bottom:8px;flex:0 0 auto}
.kick{font-size:12.5px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.g-head h2{margin:2px 0 0;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.g-head p{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.45}

/* ---------- step header ---------- */
.s-head{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid var(--line);padding-bottom:8px;flex:0 0 auto}
.s-head .hl{flex:1;min-width:0}
.rpill{display:inline-block;font-size:12.5px;font-weight:800;color:var(--panel);background:var(--rc);border-radius:999px;padding:3px 11px}
.sno{font-size:12.5px;font-weight:800;color:var(--muted);margin-left:8px}
.s-head h2{margin:5px 0 0;font-size:27px;line-height:1.2;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdots{display:flex;gap:4px;align-items:center}
.rdots button{width:27px;height:27px;border-radius:50%;border:2px solid var(--rc);background:var(--panel);font-size:11px;font-weight:800;padding:0}
.rdots button.done{background:color-mix(in srgb,var(--rc) 22%,var(--panel))}
.rdots button.cur{background:var(--rc);color:var(--panel)}
.prev{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:26px;white-space:nowrap;overflow:hidden;flex:0 0 auto}
.prev .pv{color:var(--ink);font-weight:650}
.prev .sl{cursor:pointer;text-decoration:underline;color:var(--muted)}
.prev .seed{font-weight:800;color:var(--good)}
.dch{display:inline-flex;gap:5px;overflow:hidden}
.dc{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.dc.add{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 9%,var(--panel))}
.dc.chg{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--panel))}
.dc.mv{color:var(--H);border-color:color-mix(in srgb,var(--H) 45%,var(--line));background:color-mix(in srgb,var(--H) 9%,var(--panel))}
.dc.del{color:var(--muted);text-decoration:line-through}

/* ---------- stage ---------- */
.stg{position:relative;flex:0 0 300px;padding:0 16px;overflow:hidden}
.stg-ctl{position:absolute;right:10px;top:8px;display:flex;gap:5px;z-index:4}
.stage-in{position:relative;height:100%;display:flow-root}
.host{position:relative;margin-top:var(--atop,104px);text-align:center;white-space:nowrap}
.korow{display:flex;justify-content:center;gap:.45em;margin-top:var(--kgap,48px);font-size:20px;white-space:nowrap;transition:opacity .4s}
.korow.later{opacity:0}
svg.arcs,svg.mlines,.alabs{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
svg.arcs path.arc{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .65s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg.arcs path.w3{stroke-width:4.4;opacity:.95}
svg.arcs path.w2{stroke-width:2.6;opacity:.75}
svg.arcs path.w1{stroke-width:1.6;opacity:.6}
svg.arcs circle{animation:fadein .4s ease both}
svg.mlines path{fill:none;stroke-width:2;opacity:.55;animation:fadein .5s ease both}
.alab{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--panel);
  border:1.5px solid var(--rc);color:var(--rc);white-space:nowrap;animation:fadein .4s ease both;line-height:1.35}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.no-arcs svg.arcs,.no-arcs .alabs{display:none}
.no-mirror .korow,.no-mirror svg.mlines{visibility:hidden}
.kc{font-weight:650;padding:.15em .5em;border-radius:.45em;background:color-mix(in srgb,var(--rc) 10%,var(--panel));border:1.5px solid color-mix(in srgb,var(--rc) 50%,var(--line))}
.kc.dim{opacity:.55;border-style:dashed}

/* ---------- blocks ---------- */
.sent{display:inline-block;white-space:nowrap;line-height:1.2;font-weight:600;letter-spacing:-.005em;text-align:left}
.b{display:inline-flex;flex-direction:column;align-items:stretch;margin:0 .06em;--rc:var(--X);position:relative;vertical-align:baseline}
.r-S{--rc:var(--S)}.r-V{--rc:var(--V)}.r-H{--rc:var(--H)}.r-N{--rc:var(--N)}.r-O{--rc:var(--O)}.r-C{--rc:var(--C)}
.r-M{--rc:var(--M)}.r-Q{--rc:var(--Q)}.r-K{--rc:var(--K)}.r-G{--rc:var(--G)}.r-X{--rc:var(--X)}
.b>.bt{padding:.04em .26em .06em;border-radius:.26em;background:color-mix(in srgb,var(--rc) 12%,var(--panel));border-bottom:.1em solid var(--rc)}
.b>.bl{font-size:max(10.5px,.28em);font-weight:800;color:var(--rc);text-align:center;letter-spacing:.02em;line-height:1.15;padding-top:.28em;white-space:nowrap}
.b.in>.bt{background:color-mix(in srgb,var(--rc) 7%,transparent);border:1px dashed color-mix(in srgb,var(--rc) 55%,transparent);border-bottom:.08em solid var(--rc);padding:0 .16em}
.b.in>.bl{font-size:max(9.5px,.24em)}
.b.x>.bt{background:transparent;border:0;padding:0}
.b.x>.bl{display:none}
.b.gap>.bt{background:transparent;border:1px dashed var(--G);color:var(--muted);font-style:italic;font-weight:500}
.nolab .b>.bl{display:none}
.b.seat::before{content:"2";position:absolute;left:-.1em;top:-.5em;font-size:.3em;font-weight:900;width:1.6em;height:1.6em;line-height:1.6em;
  text-align:center;border-radius:50%;background:var(--ink);color:var(--bg);z-index:2;font-style:normal}
.b.mv{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.b.new{animation:pop .7s cubic-bezier(.2,.9,.3,1.25) .3s both}
.b.new>.bt,.b.wrap>.bt{animation:glow 1.8s ease .3s}
.b.chg>.bt{animation:flash 1.6s ease .25s}
@keyframes pop{0%{opacity:0;transform:translateY(-.5em) scale(.6)}100%{opacity:1;transform:none}}
@keyframes glow{0%,45%{box-shadow:0 0 0 .14em color-mix(in srgb,var(--rc) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes flash{0%{box-shadow:0 0 0 0 transparent}25%,55%{box-shadow:0 0 0 .16em color-mix(in srgb,var(--warn) 55%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.ghost{position:absolute;pointer-events:none;margin:0;animation:gone .6s ease forwards;white-space:nowrap}
@keyframes gone{to{opacity:0;transform:translateY(.7em) scale(.85)}}
.oldtag{position:absolute;pointer-events:none;color:var(--warn);font-weight:700;white-space:nowrap;animation:rise 1.9s ease forwards}
@keyframes rise{0%{opacity:0;transform:translateY(.4em)}20%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-.8em)}}
.noanim *{animation:none!important;transition:none!important}
.noanim svg.arcs path.arc{stroke-dashoffset:0}
.noanim .oldtag,.noanim .ghost{display:none}

/* ---------- step bottom ---------- */
.s-bot{flex:1;min-height:0;display:grid;grid-template-columns:1.45fr 1fr .95fr;gap:12px}
.pane{padding:11px 15px;overflow:hidden;font-size:15.5px;line-height:1.5;min-height:0}
.pane h3{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.pane h3.mt{margin-top:12px}
.why ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.why li{position:relative;padding-left:18px}
.why li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--rc)}
.why li.lit{background:color-mix(in srgb,var(--rc) 10%,transparent);border-radius:8px}
.why li.dim{opacity:.4}
.mind{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mind span{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:1px 8px;font-size:14.5px}
.mind i{color:var(--muted);font-style:normal;font-size:12px}
.kos{font-size:15px;color:var(--ink)}
.side{display:flex;flex-direction:column;gap:8px}
.side .sp{flex:1}
.seatbox{font-size:14.5px}
.seatbox .w{display:inline-block;font-weight:800;border-radius:7px;padding:0 8px;background:color-mix(in srgb,var(--H) 12%,var(--panel));border:1.5px solid var(--H)}
.rrule{font-size:14px;color:var(--muted);border-left:3px solid var(--rc);padding-left:9px}
.ulinks{display:flex;flex-wrap:wrap;gap:5px}
.ulink{font-size:12.5px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 9px;text-decoration:none;color:var(--ink);white-space:nowrap}
.ulink:hover{border-color:var(--accent)}
.cmpc{border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:14px;background:var(--bg)}
.cmpc b{display:block;font-size:14.5px}
.cmpc.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.cmpc.meh{border-color:color-mix(in srgb,var(--rev) 55%,var(--line))}
.cmpc small{color:var(--muted)}

/* ---------- switch ---------- */
.sw{display:flex;flex-direction:column;gap:7px}
.swr .nm{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:3px}
.swr .opts{display:flex;flex-wrap:wrap;gap:4px}
.opt{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 10px;font-size:13.5px}
.opt:hover{border-color:var(--rc,var(--accent))}
.opt.on{background:var(--rc,var(--accent));color:var(--panel);border-color:var(--rc,var(--accent))}
.swr .nt{font-size:12px;color:var(--muted);margin-top:2px}
.swlog{font-size:13.5px;color:var(--muted);min-height:1.4em}
.swlog b{color:var(--warn)}

/* ---------- other slides ---------- */
.cover{justify-content:center;gap:14px}
.cover h1{font-size:62px;margin:2px 0 4px;letter-spacing:-.02em;line-height:1.05}
.cover .cv-top p{margin:0;font-size:18px;color:var(--muted)}
.cv-stage{flex:0 0 290px}
.cv-pr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cv-pr .card{padding:12px 16px;border-top:4px solid var(--rc);display:flex;flex-direction:column;gap:4px;font-size:15px}
.cv-pr b{font-size:17px}
.cv-pr span{color:var(--muted)}
.cv-foot{font-size:13.5px;color:var(--muted);text-align:center}
.stg.mir{flex:0 0 226px}
.mir .b>.bl{font-size:.4em}
.note{padding:12px 18px;font-size:15.5px;line-height:1.55}
.note b{color:var(--ink)}
.row2{display:grid;gap:12px;flex:1;min-height:0}
.p1l{padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.stg.mini{flex:0 0 190px;box-shadow:none;border:0;padding:0}
table.hm{border-collapse:separate;border-spacing:4px;margin:0 auto;font-size:15px}
table.hm th{font-weight:800;color:var(--muted);padding:2px 8px;font-size:13.5px}
table.hm th.rq{text-align:right;cursor:pointer}
table.hm td{width:62px;height:34px;text-align:center;border-radius:7px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;
  background:color-mix(in srgb,var(--accent) var(--p),var(--panel));color:var(--ink)}
table.hm tr.on th.rq{color:var(--accent)}
table.hm tr.on td{outline:2px solid var(--accent)}
.hmcap{font-size:12.5px;color:var(--muted);text-align:center}
.ev{display:flex;flex-direction:column;gap:10px;min-height:0}
.ev .card{padding:10px 15px;font-size:15px;line-height:1.5}
.ev .card b.t{display:block;font-size:16px;margin-bottom:2px}
.ev small{color:var(--muted);font-size:12.5px;line-height:1.45}
.p2t{display:grid;grid-template-columns:120px 1fr 1fr;gap:12px 14px;align-items:center;padding:12px 18px}
.p2t .hd{font-size:12.5px;font-weight:800;color:var(--muted)}
.p2t .wh{font-weight:800;font-size:14.5px}
.cw{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cw span{font-size:19px;padding:2px 8px;border-radius:7px;background:var(--soft);border:1px solid var(--line)}
.cw span.wait{opacity:.45}
.cw span.it{background:color-mix(in srgb,var(--accent) 16%,var(--panel));border:2px solid var(--accent);font-weight:800}
.cw em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.meter{grid-column:2/-1;display:none}
.mach{display:grid;grid-template-columns:1fr 330px;gap:12px;flex:0 0 auto}
.machc{padding:8px 14px 10px;display:flex;flex-direction:column;gap:4px}
.machc .stg{flex:0 0 150px;border:0;box-shadow:none;padding:0}
.machb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.machko{font-size:14.5px;color:var(--muted);text-align:center;min-height:1.4em}
.rules{padding:10px 15px;font-size:14.5px;line-height:1.5}
.rules ol{margin:4px 0 0;padding-left:20px}
.rules li{margin-bottom:3px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
table.grid th{font-size:12px;font-weight:800;color:var(--muted);text-align:left;padding:5px 8px;background:var(--soft);border-bottom:1px solid var(--line)}
table.grid th.seatc{color:var(--H)}
table.grid td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td span{display:inline-block;border-radius:6px;padding:0 6px;background:color-mix(in srgb,var(--rc) 12%,var(--panel));border-bottom:2px solid var(--rc);font-weight:650}
table.grid td.seatc{background:color-mix(in srgb,var(--H) 6%,transparent)}
.gridc{padding:4px 8px;overflow:hidden}
.stairs{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:start;min-height:0}
.stair{display:flex;flex-direction:column;gap:4px}
.stair .sh{border-top:4px solid var(--rc);background:var(--panel);border-radius:10px;padding:6px 8px;font-size:13.5px;font-weight:800;box-shadow:var(--shadow)}
.stair .sh small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.sx{display:flex;gap:5px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 6px;font-size:11.5px;line-height:1.3;
  border-left:3px solid var(--rc)}
.sx:hover{border-color:var(--rc)}
.sx i{font-style:normal;font-weight:800;color:var(--rc);min-width:16px}
.sx span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .lg i{width:14px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--rc) 25%,var(--panel));border-bottom:3px solid var(--rc)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.tab{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 13px;font-size:13.5px}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swp{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
.swp .pane{font-size:15px}
.stg.ask-stg{flex:0 0 220px}
.ask-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.ask-ctl .lbl{font-size:13px;font-weight:800;color:var(--muted);margin-right:4px}
.ask-ctl .sp{flex:1}
.ask-ctl label{font-size:13.5px;display:flex;gap:5px;align-items:center;cursor:pointer}
.ask-bot{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.qsteps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.qsteps li{display:flex;gap:8px;align-items:flex-start;animation:fadein .5s ease both}
.qsteps li b.n{flex:0 0 auto;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px}
.prompt{font-size:22px;font-weight:700;text-align:center;padding:16px}
.prompt small{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:6px}
.dr-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);flex:0 0 auto}
.dr-top .sp{flex:1}
.dr-prev{padding:8px 18px 10px;text-align:center;flex:0 0 auto}
.dr-prev small{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.dr-ko{padding:12px 18px;font-size:26px;font-weight:700;text-align:center;flex:0 0 auto}
.dr-ko small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.dzone{min-height:92px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;flex:0 0 auto}

.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:25px;font-weight:600;padding:5px 12px;border-radius:10px;--rc:var(--X);
  border:1.5px solid color-mix(in srgb,var(--rc) 55%,var(--line));background:color-mix(in srgb,var(--rc) 10%,var(--panel));border-bottom:3px solid var(--rc)}
.chip .nw{font-size:10px;font-weight:900;color:#fff;background:var(--good);border-radius:5px;padding:1px 4px}
.chip.ok{box-shadow:0 0 0 3px var(--good)}
.chip.bad{box-shadow:0 0 0 3px var(--bad)}

</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="canvas"></div></div>
<div id="nav">
  <button class="nb" id="nPrev" title="이전 (←)">◀</button>
  <span class="cnt" id="nCnt">1 / 1</span>
  <button class="nb" id="nNext" title="다음 (→, Space)">▶</button>
  <span class="ttl" id="nTtl"></span>
  <button class="nb" id="nMap" title="지도 (M)">🗺 지도</button>
  <button class="nb" id="nArc" title="attention 곡선 켜기/끄기 (A)">⌒ 곡선</button>
  <button class="nb" id="nKo" title="한국어 거울 켜기/끄기 (K)">⇅ 거울</button>
  <button class="nb" id="nLab" title="품사 라벨 켜기/끄기 (L)">🏷 라벨</button>
  <button class="nb" id="nTheme" title="밝게/어둡게 (T)">🌓</button>
  <button class="nb" id="nFull" title="전체 화면 (F)">⛶</button>
  <input id="nGo" placeholder="Step #" title="Step 번호(1–45)를 입력하고 Enter">
</div>
<pre id="stout" hidden></pre>
<script>
'use strict';
// ===== engine: markup → colour blocks, morph (FLIP), attention arcs, Korean mirror =====
const Q_ = location.search + location.hash;
const SELFTEST = /selftest/.test(Q_);
const NOANIM = SELFTEST || /noanim/.test(Q_);
if (NOANIM) document.documentElement.classList.add('noanim');
const WARN = []; let CTX = '';
function warn(m) { const s = (CTX ? CTX + ': ' : '') + m; if (!WARN.includes(s)) WARN.push(s); if (!SELFTEST) console.warn(s); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function svgEl(cls) { const e = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); e.setAttribute('class', cls); return e; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>')
  .replace(/✗/g, '<span class="no">✗</span>').replace(/✓/g, '<span class="yes">✓</span>');

let SCALE = 1, timers = [];
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

// ---------------------------------------------------------------- markup
const ROLES = 'SVHNOCMQKGX';
const LAB = {S: '주어 S', V: '동사 V', H: '조동사 Aux', N: '부정 not', O: '목적어 O', C: '보어 C', M: '수식어 M', Q: '의문사 Wh', K: '연결어', G: '생략 가능', X: ''};
const LAB_IN = {s: '주어', v: '동사', h: '조동사', n: '부정', o: '목적어', c: '보어', m: '수식', q: '의문사', k: '연결', g: '생략', x: ''};
const PCACHE = new Map();
function parse(s) {
  if (PCACHE.has(s)) return JSON.parse(PCACHE.get(s));
  let i = 0;
  const seq = end => {
    const out = []; let buf = '';
    while (i < s.length) {
      const ch = s[i];
      if (end && ch === end) { if (buf) out.push({t: 'txt', v: buf}); i++; return out; }
      if (ch === '[') {
        if (buf) { out.push({t: 'txt', v: buf}); buf = ''; }
        const m = /^([A-Za-z])((?:#[A-Za-z0-9]+|\{[^}]*\})*) ?/.exec(s.slice(i + 1));
        if (!m) throw new Error('bad block: ' + s);
        i += 1 + m[0].length;
        const n = {t: 'blk', role: m[1], id: null, lab: null};
        (m[2].match(/#[A-Za-z0-9]+|\{[^}]*\}/g) || []).forEach(o => { if (o[0] === '#') n.id = o.slice(1); else n.lab = o.slice(1, -1); });
        if (!ROLES.includes(n.role.toUpperCase())) throw new Error('unknown role ' + n.role + ': ' + s);
        n.kids = seq(']');
        out.push(n); continue;
      }
      if (ch === ']') throw new Error('stray ]: ' + s);
      buf += ch; i++;
    }
    if (end) throw new Error('missing ' + end + ': ' + s);
    if (buf) out.push({t: 'txt', v: buf});
    return out;
  };
  const r = seq(null);
  PCACHE.set(s, JSON.stringify(r));
  return r;
}
function textOf(ns) { return ns.map(n => n.t === 'txt' ? n.v : (n.role.toUpperCase() === 'G' ? '' : textOf(n.kids))).join(''); }
function plain(ns) { return textOf(ns).replace(/\s+/g, ' ').replace(/\s+([,.?!])/g, '$1').trim(); }
function ownText(n) { return n.kids.filter(k => k.t === 'txt').map(k => k.v).join('').replace(/\s+/g, ' ').trim(); }
function findBlk(ns, id) { for (const n of ns) { if (n.t !== 'blk') continue; if (n.id === id) return n; const r = findBlk(n.kids, id); if (r) return r; } return null; }
function setText(ns, id, text) { const b = findBlk(ns, id); if (!b) { warn('setText: no block ' + id); return; } b.kids = [{t: 'txt', v: text}]; }
function parseKm(s) { return s.split(';').map(x => x.trim()).filter(Boolean).map(x => { const j = x.lastIndexOf('|'); return [x.slice(0, j).trim(), x.slice(j + 1).trim().split(/\s+/)]; }); }
function parseArcs(s) {
  return s.split(';').map(x => x.trim()).filter(Boolean).map(x => {
    const m = /^(\w+)-(\w+)\s+(\d)\s*(.*)$/.exec(x); if (!m) { warn('bad arc ' + x); return null; }
    return [m[1], m[2], +m[3], m[4].trim()];
  }).filter(Boolean);
}
function topKeyed(ns) { return ns.filter(n => n.t === 'blk' && n.id).map(n => ({k: n.id, R: n.role.toUpperCase()})); }
function autoSeat(ns) { const t = topKeyed(ns); const x = t.find(b => b.R === 'H') || t.find(b => b.R === 'V'); return x ? x.k : null; }
function autoArcs(ns) {
  const t = topKeyed(ns), f = p => t.findIndex(p), out = [];
  const iS = f(b => b.k === 's'), iH = f(b => b.R === 'H'), iV = f(b => b.R === 'V'), iQ = f(b => b.R === 'Q' && b.k !== 's'), iO = f(b => b.R === 'O' || b.R === 'C');
  if (iH >= 0 && iS >= 0) out.push([t[iH].k, t[iS].k, 3, iH < iS ? '점프: 질문' : '일치']);
  else if (iS >= 0 && iV >= 0) out.push([t[iS].k, t[iV].k, 3, '일치']);
  if (iH >= 0 && iV >= 0) out.push([t[iH].k, t[iV].k, 2, '']);
  if (iQ >= 0 && iV >= 0) out.push([t[iQ].k, t[iV].k, 2, '빈자리에서 옴']);
  if (iV >= 0 && iO >= 0) out.push([t[iV].k, t[iO].k, 2, '']);
  return out;
}

// ---------------------------------------------------------------- render
function renderNodes(ns, opt) {
  const frag = document.createDocumentFragment();
  ns.forEach(n => {
    if (n.t === 'txt') { frag.appendChild(document.createTextNode(n.v)); return; }
    const R = n.role.toUpperCase(), inner = n.role !== R;
    const b = h('span', 'b r-' + R + (inner ? ' in' : '') + (R === 'X' ? ' x' : '') + (R === 'G' ? ' gap' : ''));
    b.dataset.r = R; if (n.id) b.dataset.k = n.id;
    if (opt.seat && n.id === opt.seat) b.classList.add('seat');
    const bt = h('span', 'bt');
    if (R === 'G') bt.textContent = '(' + textOfAll(n.kids) + ')'; else bt.appendChild(renderNodes(n.kids, opt));
    b.appendChild(bt);
    const lab = n.lab != null ? n.lab : (inner ? LAB_IN[n.role] : LAB[R]);
    if (lab) b.appendChild(h('span', 'bl', esc(lab)));
    frag.appendChild(b);
  });
  return frag;
}
function textOfAll(ns) { return ns.map(n => n.t === 'txt' ? n.v : textOfAll(n.kids)).join('').trim(); }
function sentEl(ns, opt = {}) { const s = h('div', 'sent'); s.appendChild(renderNodes(ns, opt)); return s; }

// ---------------------------------------------------------------- FLIP morph
function ownOf(e) { const bt = e.querySelector(':scope > .bt'); let t = ''; bt.childNodes.forEach(c => { if (c.nodeType === 3) t += c.nodeValue; }); return t.replace(/\s+/g, ' ').trim(); }
function snap(host) {
  const base = host.getBoundingClientRect(), m = {};
  host.querySelectorAll('[data-k]').forEach(e => {
    const r = e.getBoundingClientRect(), p = e.parentElement.closest('[data-k]');
    m[e.dataset.k] = {x: (r.left - base.left) / SCALE, y: (r.top - base.top) / SCALE, own: ownOf(e), r: e.dataset.r, el: e, clone: e.cloneNode(true), anc: p ? p.dataset.k : null};
  });
  return m;
}
function flip(host, A, B, fs) {
  const moved = [];
  for (const k in B) {
    const b = B[k], e = b.el, a = A[k];
    if (!a) {
      const kids = $$('[data-k]', e).some(c => A[c.dataset.k]);
      e.classList.add(kids ? 'wrap' : 'new'); continue;
    }
    let dx = a.x - b.x, dy = a.y - b.y;
    if (b.anc && A[b.anc] && B[b.anc]) { dx -= A[b.anc].x - B[b.anc].x; dy -= A[b.anc].y - B[b.anc].y; }
    if (a.own.toLowerCase() !== b.own.toLowerCase() || a.r !== b.r) {
      e.classList.add('chg');
      if (a.own && a.own.toLowerCase() !== b.own.toLowerCase()) { const t = h('span', 'oldtag', '<s>' + esc(a.own) + '</s>'); t.style.left = b.x + 'px'; t.style.top = (b.y - fs * 0.62) + 'px'; t.style.fontSize = (fs * 0.42) + 'px'; host.appendChild(t); }
    }
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) { e.style.transform = `translate(${dx}px,${dy}px)`; moved.push(e); }
  }
  for (const k in A) {
    if (B[k]) continue;
    const a = A[k];
    if (a.anc && A[a.anc] && !B[a.anc]) continue;
    const g = a.clone; g.classList.add('ghost'); g.style.left = a.x + 'px'; g.style.top = a.y + 'px'; g.style.fontSize = fs + 'px';
    host.appendChild(g);
  }
  void host.offsetWidth;
  moved.forEach(e => { e.classList.add('mv'); e.style.transform = ''; });
}

// ---------------------------------------------------------------- diff (for the "이전 문장" chips)
function keyed(ns) {
  const m = new Map();
  const rec = (xs, parent) => xs.forEach(n => {
    if (n.t !== 'blk') return;
    if (n.id) m.set(n.id, {parent, own: ownText(n), full: plain([n]) || ownText(n)});
    rec(n.kids, n.id || parent);
  });
  rec(ns, null); return m;
}
function hasSurvivor(k, M, other) {
  for (const [kk, v] of M) { let p = v.parent; while (p) { if (p === k && other.has(kk)) return true; p = (M.get(p) || {}).parent; } }
  return false;
}
function diff(a, b) {
  const A = keyed(a), B = keyed(b), out = [];
  B.forEach((v, k) => {
    if (A.has(k)) return;
    if (v.parent && !A.has(v.parent) && !hasSurvivor(v.parent, B, A)) return;
    const t = hasSurvivor(k, B, A) ? v.own : v.full;
    if (t) out.push({t: 'add', s: '+ ' + t});
  });
  B.forEach((v, k) => { const u = A.get(k); if (u && u.own.toLowerCase() !== v.own.toLowerCase()) out.push({t: 'chg', s: (u.own || '∅') + ' → ' + (v.own || '∅')}); });
  const groups = new Map();
  B.forEach((v, k) => { const u = A.get(k); if (!u || (u.parent || '') !== (v.parent || '')) return; const g = v.parent || ''; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(k); });
  groups.forEach(keys => {
    const aOrder = [...A.keys()].filter(k => keys.includes(k));
    let cur = keys.slice();
    for (let guard = 0; guard < 10; guard++) {
      const ao = aOrder.filter(k => cur.includes(k));
      if (ao.every((k, j) => cur[j] === k)) break;
      let best = null, bd = 0;
      cur.forEach((k, j) => { const d = j - ao.indexOf(k), ad = Math.abs(d); if (ad > Math.abs(bd) || (ad && ad === Math.abs(bd) && d < 0 && bd > 0)) { best = k; bd = d; } });
      if (!best) break;
      out.push({t: 'mv', s: (bd < 0 ? '↶ ' : '↷ ') + B.get(best).full + (bd < 0 ? ' 앞으로' : ' 뒤로')});
      cur = cur.filter(k => k !== best);
    }
  });
  A.forEach((v, k) => { if (B.has(k) || (v.parent && !B.has(v.parent))) return; out.push({t: 'del', s: '− ' + v.full}); });
  return out;
}
function diffChips(a, b) { return diff(a, b).slice(0, 6).map(d => `<span class="dc ${d.t}">${esc(d.s)}</span>`).join(''); }

// ---------------------------------------------------------------- drill chips
function chipsOf(ns) {
  const out = [];
  const push = (text, R, k) => {
    if (/^[,;:]$/.test(text) && out.length) { out[out.length - 1].text += text; return; }
    if (/^[.?!]+$/.test(text)) return;
    out.push({text, R, k});
  };
  const rec = (xs, R0, k0) => xs.forEach(n => {
    if (n.t === 'txt') { n.v.trim().split(/\s+/).filter(Boolean).forEach(w => push(w, R0 || 'X', k0)); return; }
    const R = n.role.toUpperCase(); if (R === 'G') return;
    const RR = R === 'X' ? (R0 || 'X') : R;
    if (n.kids.some(c => c.t === 'blk')) rec(n.kids, RR, n.id || k0);
    else push(plain(n.kids), RR, n.id || k0);
  });
  rec(ns, null, null);
  return out;
}

// ---------------------------------------------------------------- Stage
class Stage {
  constructor(root, o = {}) {
    this.o = Object.assign({max: 46, min: 17, kmax: 20, amax: 86}, o);
    this.el = h('div', 'stage-in');
    if (o.atop != null) this.el.style.setProperty('--atop', o.atop + 'px');
    if (o.kgap != null) this.el.style.setProperty('--kgap', o.kgap + 'px');
    this.svgM = svgEl('mlines'); this.svgA = svgEl('arcs'); this.labs = h('div', 'alabs');
    this.host = h('div', 'host'); this.ko = h('div', 'korow');
    this.el.append(this.svgM, this.svgA, this.host, this.ko, this.labs);
    root.appendChild(this.el);
  }
  render(ns, seat, fs) { this.host.innerHTML = ''; const s = sentEl(ns, {seat}); s.style.fontSize = fs + 'px'; this.host.appendChild(s); return s; }
  fit(list) {
    const W = this.host.clientWidth - 10; let fs = this.o.max;
    list.filter(Boolean).forEach(ns => {
      const s = this.render(ns, null, fs); const w = s.offsetWidth;
      if (w > W) { fs = Math.max(this.o.min, Math.floor(fs * W / w)); s.style.fontSize = fs + 'px'; while (s.offsetWidth > W && fs > this.o.min) { fs--; s.style.fontSize = fs + 'px'; } }
    });
    return fs;
  }
  clear() { this.svgA.innerHTML = ''; this.svgM.innerHTML = ''; this.labs.innerHTML = ''; }
  play(spec) {
    this.spec = spec; this.clear(); this.ko.classList.remove('later');
    const {nodes, from} = spec;
    const fs = this.fs = this.fit([nodes, from]);
    const anim = !NOANIM && spec.animate !== false;
    if (!anim || !from) {
      const s = this.render(nodes, spec.seat, fs); this.renderKo(spec);
      if (anim && spec.build) {
        const bs = $$(':scope > .b', s);
        bs.forEach((b, j) => { b.classList.add('new'); b.style.animationDelay = (0.15 + j * 0.14).toFixed(2) + 's'; });
        this.ko.classList.add('later');
        later(() => { this.ko.classList.remove('later'); this.overlays(); }, 450 + bs.length * 140 + 450);
      } else this.overlays();
      return;
    }
    this.render(from, spec.fromSeat, fs); this.ko.innerHTML = '';
    later(() => {
      const A = snap(this.host); this.render(nodes, spec.seat, fs); const B = snap(this.host);
      flip(this.host, A, B, fs); this.renderKo(spec); this.ko.classList.add('later');
      later(() => { this.ko.classList.remove('later'); this.overlays(); }, 950);
    }, spec.delay != null ? spec.delay : 650);
  }
  renderKo(spec) {
    this.ko.innerHTML = '';
    if (!spec.km) { this.ko.style.display = 'none'; return; }
    this.ko.style.display = '';
    const chunks = typeof spec.km === 'string' ? parseKm(spec.km) : spec.km;
    chunks.forEach(([t, ids]) => {
      const c = h('span', 'kc' + (t.startsWith('(') ? ' dim' : ''), esc(t)); c.dataset.ids = ids.join(' ');
      const e = this.host.querySelector(`[data-k="${ids[0]}"]`);
      if (!e) warn('mirror target missing: ' + ids[0]);
      c.style.setProperty('--rc', `var(--${e ? e.dataset.r : 'X'})`);
      this.ko.appendChild(c);
    });
    let fs = this.o.kmax; this.ko.style.fontSize = fs + 'px';
    const W = this.el.clientWidth - 6, width = () => $$('.kc', this.ko).reduce((a, c) => a + c.offsetWidth, 0) + (chunks.length - 1) * fs * 0.45;
    while (width() > W && fs > 12) { fs--; this.ko.style.fontSize = fs + 'px'; }
  }
  overlays() {
    const sp = this.spec; this.clear();
    if (sp.arcs) this.drawArcs(sp.arcs === 'auto' ? autoArcs(sp.nodes) : sp.arcs);
    if (sp.km) this.drawMirror();
  }
  drawArcs(arcs) {
    if (typeof arcs === 'string') arcs = parseArcs(arcs);
    const base = this.el.getBoundingClientRect(), placed = []; let svg = '';
    const pos = k => {
      const b = this.host.querySelector(`[data-k="${k}"]`); if (!b) { warn('arc target missing: ' + k); return null; }
      const r = b.querySelector(':scope > .bt').getBoundingClientRect();
      return {x: (r.left + r.width / 2 - base.left) / SCALE, y: (r.top - base.top) / SCALE, R: b.dataset.r};
    };
    arcs.forEach(([a, b, w, lab], i) => {
      const p = pos(a), q = pos(b); if (!p || !q) return;
      const span = Math.abs(q.x - p.x), top = Math.min(p.y, q.y) - 3;
      const hh = Math.min(this.o.amax, 22 + span * 0.3), cy = top - hh, col = `var(--${p.R})`, f = v => v.toFixed(1);
      svg += `<path class="arc w${w}" pathLength="1" style="stroke:${col};animation-delay:${(i * 0.13).toFixed(2)}s" d="M${f(p.x)},${f(p.y - 3)} C${f(p.x)},${f(cy)} ${f(q.x)},${f(cy)} ${f(q.x)},${f(q.y - 3)}"/>`;
      [p, q].forEach(z => { svg += `<circle cx="${f(z.x)}" cy="${f(z.y - 3)}" r="${w > 2 ? 3.6 : 2.6}" style="fill:${col}"/>`; });
      if (lab) {
        const L = h('span', 'alab', esc(lab)); L.style.setProperty('--rc', col);

let ACTIVE = null, SLIDEKEYS = null;
function activate(stage, spec) { ACTIVE = {stage, spec}; stage.play(spec); }
function replay() { if (ACTIVE) ACTIVE.stage.play(ACTIVE.spec); }
function say(text) {
  try {
    if (!('speechSynthesis' in window) || !text) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
    const vs = speechSynthesis.getVoices(); const v = vs.find(x => x.lang === 'en-US' && x.localService) || vs.find(x => /^en/.test(x.lang));
    if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u);

}

// ---------------------------------------------------------------- subject switch
function swNodes(cfg, st) {
  const ns = parse(cfg.base), subj = cfg.subj[st.si], key = subj[1];
  setText(ns, cfg.sk || 's', subj[0]);
  for (const id in cfg.dv || {}) setText(ns, id, cfg.dv[id][key] != null ? cfg.dv[id][key] : cfg.dv[id]._);
  (cfg.rows || []).forEach((row, ri) => { const o = row.opts[st.ri[ri]]; for (const id in o[1]) setText(ns, id, key === 'pl' && o[1][id].pl ? o[1][id].pl : o[1][id]._); });
  return ns;
}
function swKm(cfg, st) {
  const ch = parseKm(cfg.km), sk = cfg.sk || 's', subj = cfg.subj[st.si];
  ch.forEach(c => { if (c[1][0] === sk) c[0] = subj[2]; });
  (cfg.rows || []).forEach((row, ri) => { const o = row.opts[st.ri[ri]]; ch.forEach(c => { if (o[2] && o[2][c[1][0]] != null) c[0] = o[2][c[1][0]]; }); });
  return ch;
}
function switchWidget(root, cfg, stage, spec0, si0) {
  const st = {si: si0 || 0, ri: (cfg.rows || []).map(() => 0)};
  let cur = swNodes(cfg, st);
  const wrap = h('div', 'sw'), log = h('div', 'swlog', '단어를 눌러 보세요 — 어떤 단어가 반응할까요?');
  const row = (nm, note, labels, sel, pick) => {
    const r = h('div', 'swr', `<div class="nm">${esc(nm)}</div>`), o = h('div', 'opts');
    labels.forEach((l, j) => { const b = h('button', 'opt' + (j === sel ? ' on' : ''), esc(l)); b.onclick = () => pick(j); o.appendChild(b); });
    r.appendChild(o); if (note) r.appendChild(h('div', 'nt', md(note))); return r;
  };
  const change = mut => {
    mut(); const nn = swNodes(cfg, st), d = diff(cur, nn).filter(x => x.t === 'chg');
    log.innerHTML = d.length ? '바뀐 단어: ' + d.map(x => `<b>${esc(x.s)}</b>`).join(' · ') : '바뀐 단어가 없어요';
    const sp = Object.assign({}, spec0, {nodes: nn, from: cur, fromSeat: spec0.seat, km: swKm(cfg, st), delay: 0, build: false, say: plain(nn)});
    cur = nn; draw(); activate(stage, sp);
  };
  const draw = () => {
    wrap.innerHTML = '';
    wrap.appendChild(row('주어 S 바꾸기', cfg.subjNote, cfg.subj.map(x => x[0]), st.si, j => change(() => { st.si = j; })));
    (cfg.rows || []).forEach((r, ri) => wrap.appendChild(row(r.nm, r.note, r.opts.map(o => o[0]), st.ri[ri], j => change(() => { st.ri[ri] = j; }))));
    wrap.appendChild(log);
  };
  draw(); root.appendChild(wrap);
  return {nodes: () => cur, km: () => swKm(cfg, st)};
}

// ===== slides part 1: intro, map, steps =====
function head(el, kick, title, sub) { el.appendChild(h('div', 'g-head', `<div class="kick">${kick}</div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}`)); }
const finalEn = st => st.boss ? st.seq[st.seq.length - 1].en : st.en;
const stepText = i => plain(parse(finalEn(STEPS[i])));
function fromIdx(i) { const st = STEPS[i]; if (st.from === 0) return -1; if (st.from) return st.from - 1; return i > 0 && STEPS[i - 1].r === st.r ? i - 1 : -1; }
function ulinks(units) { return (units || []).map(u => `<a class="ulink" href="grammar_map_101.html#${u}" target="_blank" rel="noopener" title="영어 구문 지도 101에서 열기">📘 ${u} · ${esc(UNITS[u] || '')}</a>`).join(''); }
function mindHTML(m) { return `<h3>영어 순서로 생각하기</h3><div class="mind">${m.split('/').map(x => `<span>${esc(x.trim())}</span>`).join('<i>→</i>')}</div>`; }

    <div class="card" style="--rc:var(--Q)"><b>② 의도 · 틀이 먼저</b><span>Do · Did · What · I don't think… 첫 단어에서 말하는 사람의 의도가 보여요.</span></div>
    <div class="card" style="--rc:var(--H)"><b>＋ 제안: 2번 자리</b><span>주어 바로 뒤 한 칸이 시제 · 부정 · 질문 · 짧은 대답을 모두 조종해요.</span></div>`));
  el.appendChild(h('div', 'cv-foot', '<kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>M</kbd> 지도 · <kbd>A</kbd> 곡선 · <kbd>K</kbd> 한국어 거울 · <kbd>R</kbd> 변신 다시 보기 · <kbd>F</kbd> 전체 화면'));
  const chain = [0, 1, 2, 3, 4, 6]; let k = 0;

  next();
}

// ---------------------------------------------------------------- step slides
function stepHeader(i) {
  const st = STEPS[i], R = ROUNDS[st.r - 1], hd = h('div', 's-head');
  hd.innerHTML = `<div class="hl"><div><span class="rpill">${st.r < 8 ? 'ROUND ' + st.r : '★ BOSS'} · ${esc(R.t)}</span><span class="sno">STEP ${i + 1} / ${STEPS.length}</span></div><h2>${md(st.h)}</h2></div>`;
  const dots = h('div', 'rdots');
  STEPS.forEach((s, j) => { if (s.r !== st.r) return; const b = h('button', j === i ? 'cur' : j < i ? 'done' : '', String(j + 1)); b.title = stepText(j); b.dataset.go = 's' + (j + 1); dots.appendChild(b); });
  hd.appendChild(dots);
  return hd;
}
function prevLine(from, to, label) {
  const pv = h('div', 'prev');
  pv.innerHTML = from ? `<span>이전 문장 ${label} ▸</span><span class="pv">${esc(plain(from))}</span><span class="dch">${diffChips(from, to)}</span>`

function sideFoot(i, st) {

  el.appendChild(stepHeader(i));

  el.appendChild(prevLine(from, to, from ? `<span class="sl" data-go="s${fi + 1}">(Step ${fi + 1})</span>` : ''));

  const stage = new Stage(stg);
  const spec = {nodes: to, from, fromSeat: fi >= 0 ? STEPS[fi].seat : null, arcs: st.arcs, km: st.km, seat: st.seat, build: !from, say: plain(to)};
  const bot = h('div', 's-bot'); el.appendChild(bot);
  bot.appendChild(h('div', 'pane card why', `<h3>왜 이 자리?</h3><ul>${st.why.map(w => `<li>${md(w)}</li>`).join('')}</ul>`));
  bot.appendChild(h('div', 'pane card mid', mindHTML(st.mind) + `<h3 class="mt">한국어 뜻</h3><div class="kos">${esc(st.ko)}</div>`));
  const side = h('div', 'pane card side'); bot.appendChild(side);

  else {
    const sb = findBlk(to, st.seat);
    side.appendChild(h('div', 'seatbox', `<h3>2번 자리</h3>지금 2번 자리 단어: <span class="w">${esc(sb ? plain([sb]) : '-')}</span>`));
    side.appendChild(h('div', 'rrule', `<b>Round ${st.r} 규칙</b><br>${esc(R.rule)}`));
  }
  side.appendChild(h('div', 'sp'));

function buildBoss(el, i) {
  const st = STEPS[i], R = ROUNDS[st.r - 1];
  el.classList.add('step'); el.style.setProperty('--rc', `var(--${R.c})`);
  el.appendChild(stepHeader(i));
  const pvBox = h('div', ''); el.appendChild(pvBox);
  const stg = h('div', 'stg card'); el.appendChild(stg); stg.appendChild(stageCtl(i));
  const stage = new Stage(stg, {max: 40});
  const bot = h('div', 's-bot'); el.appendChild(bot);
  const why = h('div', 'pane card why'); bot.appendChild(why);
  const mid = h('div', 'pane card mid'); bot.appendChild(mid);
  const side = h('div', 'pane card side'); bot.appendChild(side);
  const nav = h('div', 'sw'); side.appendChild(nav); side.appendChild(h('div', 'sp')); side.appendChild(sideFoot(i, st));
  let L = NOANIM ? st.seq.length - 1 : 0;
  const show = (l, anim) => {
    L = Math.max(0, Math.min(st.seq.length - 1, l));
    const S = st.seq[L], to = parse(S.en), from = L > 0 && anim ? parse(st.seq[L - 1].en) : null;
    pvBox.replaceChildren(prevLine(L > 0 ? parse(st.seq[L - 1].en) : null, to, `(층 ${L})`));
    why.innerHTML = `<h3>체크리스트 — 층 ${L + 1} / ${st.seq.length}</h3><ul>${st.why.map((w, j) => `<li class="${j === L ? 'lit' : j > L ? 'dim' : ''}">${md(w)}</li>`).join('')}</ul>`;
    mid.innerHTML = `<h3>이번 층</h3><div class="kos"><b>${esc(S.note)}</b></div><h3 class="mt">한국어 뜻</h3><div class="kos">${esc(S.ko)}</div>`;
    nav.innerHTML = `<h3>층 쌓기</h3><div class="opts">${st.seq.map((_, j) => `<button class="opt${j === L ? ' on' : ''}" data-l="${j}">${j + 1}</button>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:6px"><button class="btn sm" data-l="${L - 1}">◀ 이전 층</button><button class="btn sm pri" data-l="${L + 1}">다음 층 ▶ <kbd>N</kbd></button></div>`;
    activate(stage, {nodes: to, from, fromSeat: L > 0 ? st.seq[L - 1].seat : null, arcs: S.arcs, km: S.km, seat: S.seat, build: !from && anim, delay: 250, say: plain(to)});
  };
  nav.addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (b) show(+b.dataset.l, true); });
  SLIDEKEYS = e => { if (e.key === 'n' || e.key === 'N') { show(L + 1, true); return true; } return false; };
  show(L, true);
}

  const body = h('div', 'swp'); el.appendChild(body);
  const left = h('div', 'pane card'), right = h('div', 'pane card'); body.append(left, right);
  let fi = 0;
  const load = () => {
    tabs.innerHTML = ''; FR.forEach((f, j) => { const b = h('button', 'tab' + (j === fi ? ' on' : ''), esc(SWITCH[f].tab)); b.onclick = () => { fi = j; load(); }; tabs.appendChild(b); });
    $$('.stage-in', stg).forEach(x => x.remove());
    const cfg = SWITCH[FR[fi]], stage = new Stage(stg, {atop: 92}), st0 = {si: 0, ri: (cfg.rows || []).map(() => 0)};
    const nodes = swNodes(cfg, st0);
    const spec = {nodes, arcs: cfg.arcs, km: swKm(cfg, st0), seat: cfg.seat, say: plain(nodes)};
    left.innerHTML = '<h3>바꿔 보기</h3>'; switchWidget(left, cfg, stage, spec, 0);
    right.innerHTML = `<h3>오늘의 발견</h3><div>${md(cfg.lesson)}</div><h3 class="mt">이렇게 말해 보세요</h3><div class="kos">주어를 바꿀 때마다 문장 전체를 소리 내어 읽기 → 반응하는 단어를 <b>먼저</b> 예측해 보기.</div>`;

function buildAsk(el) {
  head(el, '연습 ②', '의도 먼저! 질문 만들기', '평서문을 보고 ‘무엇을 묻고 싶은지’ 고르세요. 의문사와 2번 자리가 어떻게 움직이는지 봅니다.');
  const tabs = h('div', 'tabs'); el.appendChild(tabs);
  const stg = h('div', 'stg card ask-stg'); el.appendChild(stg); stg.appendChild(stageCtl());
  const stage = new Stage(stg, {atop: 86, max: 44});
  const ctl = h('div', 'ask-ctl'); el.appendChild(ctl);
  const bot = h('div', 'ask-bot'); el.appendChild(bot);
  const lp = h('div', 'pane card'), rp = h('div', 'pane card'); bot.append(lp, rp);
  let si = 0, qi = null, speak = false, pending = null, cur = null;
  const setNodes = (nn, k) => { activate(stage, {nodes: nn, from: cur, fromSeat: cur ? autoSeat(cur) : null, arcs: 'auto', seat: autoSeat(nn), delay: 0, say: plain(nn)}); cur = nn; };
  const drawTabs = () => {
    tabs.innerHTML = ''; QSETS.forEach((S, j) => { const b = h('button', 'tab' + (j === si ? ' on' : ''), esc(S.name)); b.onclick = () => { si = j; qi = null; pending = null; cur = null; draw(); setNodes(parse(QSETS[si].st)); }; tabs.appendChild(b); });
  };
  const draw = () => {
    drawTabs();
    const S = QSETS[si];
    ctl.innerHTML = '<span class="lbl">무엇을 묻고 싶나요?</span>';
    S.qs.forEach((q, j) => { const b = h('button', 'btn sm' + (j === qi ? ' on' : ''), esc(q.l)); b.onclick = () => choose(j); ctl.appendChild(b); });
    const back = h('button', 'btn sm', '↺ 평서문으로'); back.onclick = () => { qi = null; pending = null; draw(); setNodes(parse(S.st)); }; ctl.appendChild(back);
    ctl.appendChild(h('span', 'sp'));
    const lab = h('label', '', `<input type="checkbox" ${speak ? 'checked' : ''}> 🗣 먼저 말해 보기 (정답은 나중에)`);
    lab.querySelector('input').onchange = e => { speak = e.target.checked; }; ctl.appendChild(lab);
    if (pending != null) {
      lp.innerHTML = `<div class="prompt">${esc(S.qs[pending].ko)}<small>머릿속으로(또는 소리 내어) 영어 질문을 먼저 만들어 보세요. 첫 단어는 무엇일까요?</small></div>`;
      const b = h('button', 'btn pri', '정답 보기 ▶ <kbd>Enter</kbd>'); b.onclick = reveal; lp.appendChild(h('div', '', '')).appendChild(b); lp.lastChild.style.textAlign = 'center';
      rp.innerHTML = `<h3>평서문</h3><div class="kos">${esc(plain(parse(S.st)))}<br><small>${esc(S.ko)}</small></div>`;
    } else if (qi == null) {
      lp.innerHTML = `<h3>순서</h3><ol class="qsteps"><li><b class="n">1</b><span>알고 싶은 것을 정한다 → 의문사(What · Where · When · Who …)가 <b>맨 앞</b></span></li><li><b class="n">2</b><span>2번 자리(will · did · has · can)가 <b>주어 앞</b>으로 점프 — 비어 있으면 do를 부른다</span></li><li><b class="n">3</b><span>물어본 자리는 비우고, 동사는 원형 (단, 주어를 물으면 점프 없음)</span></li></ol>`;
      rp.innerHTML = `<h3>평서문</h3><div class="kos">${esc(plain(parse(S.st)))}<br><small>${esc(S.ko)}</small></div>`;
    } else {
      const q = S.qs[qi];
      lp.innerHTML = `<h3>무슨 일이 일어났나</h3><ol class="qsteps">${q.steps.map((s, j) => `<li style="animation-delay:${0.5 + j * 0.5}s"><b class="n">${j + 1}</b><span>${md(s)}</span></li>`).join('')}</ol>`;
      rp.innerHTML = `<h3>질문</h3><div class="kos"><b>${esc(plain(parse(q.q)))}</b><br><small>${esc(q.ko)}</small></div><h3 class="mt">평서문</h3><div class="kos">${esc(plain(parse(S.st)))}<br><small>${esc(S.ko)}</small></div>`;
    }
  };
  const choose = j => { if (speak) { pending = j; qi = null; draw(); } else { qi = j; pending = null; draw(); setNodes(parse(QSETS[si].qs[j].q)); } };
  const reveal = () => { if (pending == null) return; qi = pending; pending = null; draw(); setNodes(parse(QSETS[si].qs[qi].q)); };
  SLIDEKEYS = e => { if (e.key === 'Enter' && pending != null) { reveal(); return true; } return false; };
  draw(); setNodes(parse(QSETS[si].st));
}

const DR = {i: 0, rnd: false, score: 0, tried: 0};
function buildDrill(el) {
  head(el, '연습 ③', '문장 키우기 드릴', '한국어 뜻을 보고 영어 블록을 순서대로 누르세요. <b style="color:var(--good)">NEW</b> = 이전 문장에 새로 붙은 조각. 어디에 들어갈까요?');
  const top = h('div', 'dr-top'), prevC = h('div', 'card dr-prev'), ko = h('div', 'card dr-ko'), zone = h('div', 'dzone'), pool = h('div', 'pool'), ctl = h('div', 'dr-ctl'), fb = h('div', 'dr-fb');
  el.append(top, prevC, ko, zone, pool, ctl, fb);
  let ans, chips, placed, done, punct;
  const load = () => {
    const st = STEPS[DR.i], to = parse(finalEn(st)), fi = fromIdx(DR.i);
    const prevNodes = st.boss ? parse(st.seq[st.seq.length - 2].en) : fi >= 0 ? parse(STEPS[fi].en) : null;
    const A = prevNodes ? keyed(prevNodes) : new Map();
    chips = chipsOf(to).map((c, j) => Object.assign(c, {id: j, nw: !!prevNodes && !!c.k && !A.has(c.k)}));
    ans = chips.map(c => c.text); punct = (plain(to).match(/[.?!]$/) || [''])[0];
    let sh = chips.slice();
    for (let t = 0; t < 8; t++) { sh = sh.map(c => [Math.random(), c]).sort((a, b) => a[0] - b[0]).map(x => x[1]); if (sh.length < 2 || sh.some((c, j) => c.text !== ans[j])) break; }
    chips = sh; placed = []; done = false; fb.textContent = ''; fb.className = 'dr-fb';
    top.innerHTML = `<span class="rpill" style="--rc:var(--${ROUNDS[st.r - 1].c})">${st.r < 8 ? 'ROUND ' + st.r : '★ BOSS'}</span><b style="color:var(--ink)">Step ${DR.i + 1}</b>` +
      '<span class="sp"></span>' +
      `<span>맞힌 문제 <b style="color:var(--ink)">${DR.score}</b> / ${DR.tried}</span>` +
      '<button class="btn sm" data-d="prev">◀</button><button class="btn sm" data-d="next">▶</button>' +
      `<button class="btn sm${DR.rnd ? ' on' : ''}" data-d="rnd">🔀 무작위</button><button class="btn sm" data-go="s${DR.i + 1}">이 Step 보기</button>`;
    prevC.innerHTML = prevNodes ? '<small>이전 문장 — 여기에 무엇이 붙거나 움직일까요?</small>' : '<small>🌱 새 씨앗 문장 — 처음부터 쌓아요</small>';
    if (prevNodes) { const s = sentEl(prevNodes); s.style.fontSize = '24px'; prevC.appendChild(s); }
    ko.innerHTML = `${esc(st.boss ? st.seq[st.seq.length - 1].ko : st.ko)}<small>위 뜻이 되도록 아래 블록을 순서대로 누르세요 · <kbd>Enter</kbd> 확인 · <kbd>Backspace</kbd> 되돌리기</small>`;
    draw();
  };
  const chipEl = (c, where, j) => { const b = h('button', 'chip', esc(c.text) + (c.nw ? '<span class="nw">NEW</span>' : '')); b.style.setProperty('--rc', `var(--${c.R})`); b.dataset.w = where; b.dataset.j = j; return b; };
  const draw = (marks) => {
    zone.innerHTML = ''; pool.innerHTML = '';
    if (!placed.length) zone.appendChild(h('span', 'ph', '여기에 문장이 만들어져요'));
    placed.forEach((c, j) => { const b = chipEl(c, 'z', j); if (marks) b.classList.add(marks[j] ? 'ok' : 'bad'); zone.appendChild(b); });
    if (placed.length) zone.appendChild(h('span', 'punct', esc(punct)));
    chips.forEach((c, j) => { if (!placed.includes(c)) pool.appendChild(chipEl(c, 'p', j)); });
    ctl.innerHTML = '<button class="btn" data-d="undo">↶ 되돌리기</button><button class="btn pri" data-d="check">확인 ✓</button><button class="btn" data-d="show">정답 보기</button><button class="btn" data-d="next">다음 문제 ▶</button><button class="btn" data-d="say">🔊</button>';
  };
  const check = () => {
    if (placed.length < ans.length) { fb.className = 'dr-fb bad'; fb.textContent = `블록이 ${ans.length - placed.length}개 남았어요.`; return; }
    const marks = placed.map((c, j) => c.text === ans[j]); const ok = marks.every(Boolean);
    if (!done) { DR.tried++; if (ok) DR.score++; done = true; }
    draw(marks); fb.className = 'dr-fb ' + (ok ? 'ok' : 'bad');
    fb.textContent = ok ? '정답! 🎉 ' + plain(parse(finalEn(STEPS[DR.i]))) : '빨간 블록의 자리를 다시 생각해 보세요. 힌트: 주어 바로 뒤 = 2번 자리';
  };
  const go = d => { DR.i = DR.rnd ? Math.floor(Math.random() * STEPS.length) : (DR.i + d + STEPS.length) % STEPS.length; load(); };
  el.addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (c) { const j = +c.dataset.j; if (c.dataset.w === 'p') placed.push(chips[j]); else placed.splice(j, 1); draw(); return; }
    const b = e.target.closest('[data-d]'); if (!b) return;
    const a = b.dataset.d;
    if (a === 'undo') { placed.pop(); draw(); }
    else if (a === 'check') check();
    else if (a === 'show') { placed = ans.map((t, j) => chips.filter(c => c.text === t)[ans.slice(0, j).filter(x => x === t).length]); done = true; draw(placed.map(() => true)); fb.className = 'dr-fb'; fb.textContent = '정답을 보고 소리 내어 한 번 읽어 보세요.'; }
    else if (a === 'next') go(1);
    else if (a === 'prev') go(-1);
    else if (a === 'rnd') { DR.rnd = !DR.rnd; load(); }
    else if (a === 'say') say(plain(parse(finalEn(STEPS[DR.i]))));
  });
  SLIDEKEYS = e => {
    if (e.key === 'Enter') { check(); return true; }
    if (e.key === 'Backspace') { placed.pop(); draw(); return true; }
    return false;
  };
  load();
}

function buildSummary(el) {

    <div class="card" style="border-top:4px solid var(--S)"><h4>① 주어 ↔ 동사는 한 몸</h4>동사의 <b>모양</b>(일치 · 시제)은 주어가 정하고, 목적어는 동사의 <b>뜻</b>을 완성해요. 주어가 길어져도 동사는 진짜 주어를 찾아가요.</div>
    <div class="card" style="border-top:4px solid var(--Q)"><h4>② 틀 · 의도 먼저, 무거운 내용은 뒤로</h4>질문 · 부정 · 판단 · 화제는 앞(Do · I don't think · It is important). 긴 설명 · 조건 · 시간 · 장소는 뒤.</div>
    <div class="card" style="border-top:4px solid var(--H)"><h4>③ 2번 자리</h4>주어 바로 뒤 한 칸 — <b>넣기</b>(will · can · have · be) · <b>not 붙이기</b> · <b>점프</b>(질문 · 도치) · 비어 있으면 <b>do</b>를 부른다.</div>`));
  const r = h('div', 'sumr'); row.appendChild(r);
  ROUNDS.forEach((R, ri) => {
    const first = STEPS.findIndex(s => s.r === ri + 1);
    const b = h('button', '', `<b>${ri < 7 ? 'Round ' + (ri + 1) : '★ Boss'} · ${esc(R.t)}</b><span>${esc(R.rule)}</span>`);
    b.style.setProperty('--rc', `var(--${R.c})`); b.dataset.go = 's' + (first + 1); r.appendChild(b);
  });
}

function buildHonest(el) {
  head(el, '솔직한 메모', '이 비유가 맞는 곳과 조심할 곳', '동료들이 “정말 그래요?”라고 물을 때를 위한 페이지.');
  const c = h('div', 'cards'); c.style.gridTemplateColumns = '1fr 1fr'; el.appendChild(c);
  c.innerHTML = `
    <div class="card" style="border-top:4px solid var(--good)"><h4>✔ 맞는 부분 — 주어 ↔ 동사의 끈은 진짜 있어요</h4><ul>
      <li>일치: I <b>am</b> / She <b>is</b> / They <b>are</b> — 동사(정확히는 2번 자리 단어)가 주어를 보고 모양을 바꿔요.</li>
      <li>시제 · 부정 · 질문 · 짧은 대답이 모두 ‘주어 + 2번 자리’에서 일어나요.</li></ul></div>
    <div class="card" style="border-top:4px solid var(--rev)"><h4>⚠ 조심 — 뜻으로는 동사 + 목적어도 끈끈해요</h4><ul>
      <li>언어학에서는 V + O를 한 덩어리(동사구, VP)로 봐요: <i>make a decision, take a break</i>. 관용구도 대부분 V + O (<i>kick the bucket</i>).</li>
      <li>그래서 정확한 말: <b>주어는 동사의 ‘모양’을, 목적어는 동사의 ‘뜻’을 완성한다.</b></li></ul></div>
    <div class="card" style="border-top:4px solid var(--rev)"><h4>⚠ 조심 — ‘중요한 것 먼저’ = ‘틀 먼저’</h4><ul>
      <li>질문 · 부정 · 판단 같은 <b>틀</b>은 앞에 오지만, 길고 새로운 정보는 오히려 <b>뒤로</b> 가요 (end-weight · end-focus): <i>It is important <b>to practice every day</b>.</i></li>
      <li>한국어가 ‘중요한 걸 뒤에 둔다’기보다, 한국어는 핵심(서술어)이 끝에 오는 <b>head-final</b>, 영어는 핵심이 앞에 오는 <b>head-initial</b> 언어 — 그래서 거울처럼 뒤집혀요.</li></ul></div>
    <div class="card" style="border-top:4px solid var(--H)"><h4>🧠 Self-attention과 실제 연구</h4><ul>
      <li>BERT의 attention head 중에는 ‘목적어 → 동사’, ‘한정사 → 명사’처럼 문법 관계를 따라가는 head가 있어요 (Clark et al., 2019).</li>
      <li>주어-동사 일치(<i>The keys to the cabinet <b>are</b> …</i>)는 언어 모델의 문법 능력을 시험하는 대표 과제예요 (Linzen et al., 2016; Goldberg, 2019).</li>
      <li>이 자료의 곡선 두께는 <b>설명용 그림</b>이에요. 실제 모델의 attention 값이 아니고, attention 하나가 곧 ‘문법’도 아니에요.</li></ul></div>`;
  el.appendChild(h('div', 'refs', 'Clark, Khandelwal, Levy & Manning (2019) What Does BERT Look At? An Analysis of BERT’s Attention · Linzen, Dupoux & Goldberg (2016) Assessing the Ability of LSTMs to Learn Syntax-Sensitive Dependencies · Goldberg (2019) Assessing BERT’s Syntactic Abilities'));
}

add('ask', '연습 ② 의도 먼저 질문 만들기', buildAsk);
add('drill', '연습 ③ 문장 키우기 드릴', buildDrill);
add('summary', '한 장 요약', buildSummary);
add('honest', '솔직한 메모', buildHonest);
add('methods', '수업에서 이렇게', buildMethods);
const IDX = Object.fromEntries(SL.map((s, i) => [s.id, i]));

// ---------------------------------------------------------------- navigation
const canvas = $('#canvas');
const store = {get(k, d) { try { const v = localStorage.getItem('grow.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('grow.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } }};
const PREF = Object.assign({arcs: true, mirror: true, labels: true}, store.get('prefs', {}));
let cur = 0;
function applyPrefs() {
  document.body.classList.toggle('no-arcs', !PREF.arcs); document.body.classList.toggle('no-mirror', !PREF.mirror); document.body.classList.toggle('nolab', !PREF.labels);
  $('#nArc').classList.toggle('off', !PREF.arcs); $('#nKo').classList.toggle('off', !PREF.mirror); $('#nLab').classList.toggle('off', !PREF.labels);
  store.set('prefs', PREF);
}
function toggle(k) { PREF[k] = !PREF[k]; applyPrefs(); if (k === 'labels' && ACTIVE) ACTIVE.stage.overlays(); }
function fitCanvas() { SCALE = Math.min(innerWidth / 1280, (innerHeight - 46) / 720); canvas.style.transform = `translate(-50%,-50%) scale(${SCALE})`; }
function show(i, noHash) {
  i = Math.max(0, Math.min(SL.length - 1, i));
  clearTimers(); SLIDEKEYS = null; ACTIVE = null;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  cur = i; canvas.innerHTML = '';
  const el = h('div', 'slide'); canvas.appendChild(el);
  CTX = SL[i].id;
  try { SL[i].build(el); } catch (e) { warn('build error: ' + e.message); el.appendChild(h('pre', '', esc(e.stack || e.message))); }
  $('#nCnt').textContent = `${i + 1} / ${SL.length}`; $('#nTtl').textContent = SL[i].title;
  $('#bar').style.width = ((i + 1) / SL.length * 100) + '%';
  if (!noHash && !SELFTEST) { try { history.replaceState(null, '', '#' + SL[i].id); } catch (e) { location.hash = SL[i].id; } }
  store.set('last', SL[i].id);
}
function go(id) { if (IDX[id] != null) show(IDX[id]); }
canvas.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const d = e.target.closest('[data-drill]'); if (d) { DR.i = +d.dataset.drill; go('drill'); return; }
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'replay') replay(); else if (a.dataset.a === 'say' && ACTIVE) say(ACTIVE.spec.say);
});
$('#nPrev').onclick = () => show(cur - 1); $('#nNext').onclick = () => show(cur + 1); $('#nMap').onclick = () => go('map');
$('#nArc').onclick = () => toggle('arcs'); $('#nKo').onclick = () => toggle('mirror'); $('#nLab').onclick = () => toggle('labels');
function cycleTheme() { const r = document.documentElement, t = r.dataset.theme; r.dataset.theme = t === 'dark' ? 'light' : t === 'light' ? '' : 'dark'; if (!r.dataset.theme) delete r.dataset.theme; store.set('theme', r.dataset.theme || ''); }
$('#nTheme').onclick = cycleTheme;
function full() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { /* not allowed */ } }
$('#nFull').onclick = full;
$('#nGo').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const v = e.target.value.trim(); e.target.value = ''; e.target.blur();
  if (/^\d+$/.test(v) && +v >= 1 && +v <= STEPS.length) go('s' + v); else if (IDX[v] != null) go(v);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (SLIDEKEYS && SLIDEKEYS(e)) { e.preventDefault(); return; }
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); show(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); show(cur - 1); }
  else if (k === 'Home') show(0); else if (k === 'End') show(SL.length - 1);
  else if (k === 'r' || k === 'R') replay();
  else if (k === 'a' || k === 'A') toggle('arcs'); else if (k === 'k' || k === 'K') toggle('mirror'); else if (k === 'l' || k === 'L') toggle('labels');
  else if (k === 'm' || k === 'M') go('map'); else if (k === 't' || k === 'T') cycleTheme(); else if (k === 'f' || k === 'F') full();
  else if ((k === 'd' || k === 'D') && /^s\d+$/.test(SL[cur].id)) { DR.i = +SL[cur].id.slice(1) - 1; go('drill'); }
});
addEventListener('resize', () => { fitCanvas(); if (ACTIVE && !NOANIM) ACTIVE.stage.overlays(); });
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (IDX[id] != null && IDX[id] !== cur) show(IDX[id], true); });

// ---------------------------------------------------------------- self-test (?selftest): data checks + render every slide
function dataChecks() {
  const norm = s => s.replace(/[\s.,?!]/g, '');
  STEPS.forEach((st, i) => {
    CTX = 's' + (i + 1);
    const layers = st.boss ? st.seq : [st];
    layers.forEach((L, j) => {
      let ns; try { ns = parse(L.en); } catch (e) { warn(e.message); return; }
      const ids = new Set(); (function rec(xs) { xs.forEach(n => { if (n.t === 'blk') { if (n.id) { if (ids.has(n.id)) warn('duplicate id ' + n.id); ids.add(n.id); } rec(n.kids); } }); })(ns);
      if (L.seat && !ids.has(L.seat)) warn('seat id missing ' + L.seat);
      parseArcs(L.arcs || '').forEach(([a, b]) => { if (!ids.has(a) || !ids.has(b)) warn(`arc id missing ${a}-${b}`); });
      const km = parseKm(L.km || '');
      km.forEach(([, k]) => k.forEach(x => { if (!ids.has(x)) warn('km id missing ' + x); }));
      const kj = km.filter(c => !c[0].startsWith('(')).map(c => c[0].replace(/^[①-⑳]\s*/, '')).join('');
      if (norm(kj) !== norm(L.ko)) warn(`km/ko mismatch${st.boss ? ' layer ' + (j + 1) : ''}: "${kj}" vs "${L.ko}"`);
    });
    const fi = fromIdx(i); if (st.from && (fi < 0 || fi >= i)) warn('bad from ' + st.from);
    (st.units || []).forEach(u => { if (!UNITS[u]) warn('unknown unit ' + u); });
  });
  QSETS.forEach((S, a) => { CTX = 'ask' + a; try { parse(S.st); S.qs.forEach(q => parse(q.q)); } catch (e) { warn(e.message); } });
  CTX = '';
}
function selftest() {
  dataChecks();
  const report = [];
  SL.forEach((s, i) => {
    show(i, true);
    const el = canvas.firstChild;
    if (el.scrollHeight > el.clientHeight + 2) warn(`slide overflow ${el.scrollHeight - el.clientHeight}px`);
    $$('.pane, .card', el).forEach(p => { if (p.scrollHeight > p.clientHeight + 2) warn(`overflow in .${p.className.replace(/ /g, '.')} by ${p.scrollHeight - p.clientHeight}px`); });
    $$('.host', el).forEach(hs => { const st = hs.querySelector('.sent'); if (st && st.offsetWidth > hs.clientWidth + 2) warn('sentence wider than stage'); });
    report.push(s.id);
  });
  const out = $('#stout'); out.hidden = false;
  out.textContent = `SELFTEST ${WARN.length ? 'WARN ' + WARN.length : 'OK'} — ${SL.length} slides\n` + WARN.join('\n');
  document.title = WARN.length ? 'SELFTEST WARN ' + WARN.length : 'SELFTEST OK';
}

// ---------------------------------------------------------------- start
(function init() {
  const th = store.get('theme', ''); if (th) document.documentElement.dataset.theme = th;
  fitCanvas(); applyPrefs();
  if (SELFTEST) { selftest(); return; }
  const h0 = location.hash.slice(1), last = store.get('last', 'cover');
  show(IDX[h0] != null ? IDX[h0] : IDX[last] != null ? IDX[last] : 0, IDX[h0] == null);
})();

</script>
</body>
</html>
