[project]
name = "wordstep"
version = "0.1.0"
description = "Step-by-step English dictionary and vocabulary trainer with Kokoro TTS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.12",
    "wordfreq>=3.1.1",
    "lemminflect>=0.2.3",
    "anthropic>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
